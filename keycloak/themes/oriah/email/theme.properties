#
# Oriah email theme. Extends Keycloak's base "keycloak" email theme
# (Keycloak's email pipeline uses the classic theme, not keycloak.v2)
# for plain-text + HTML transactional emails (password reset,
# verify-email, etc.).
#
# We keep the parent's templates and only override the brand colours +
# wordmark via the CSS file the templates reference. Custom .ftl
# overrides land here when the copy diverges from Keycloak defaults.
#
parent=keycloak
