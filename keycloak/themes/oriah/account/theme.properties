#
# Oriah account-console theme. Extends keycloak.v2 so the user's
# self-service password / email / device pages share the brand look
# of the login page.
#
# We reuse the login theme's CSS for now -- the account console uses
# a different React app (the "keycloak.v2" account console) but the
# core Patternfly classes still pick up our colour overrides.
#
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css
