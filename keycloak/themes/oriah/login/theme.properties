#
# Custom Oriah login theme.
#
# Strategy: extend Keycloak's modern "keycloak.v2" theme so we get the
# updated layout + Patternfly 5 / FreeMarker templates for free, then
# overlay Oriah-branded CSS via styles=css/styles.css.
#
# No .ftl template overrides are needed for the brand look -- the
# extension model means our styles.css loads AFTER keycloak.v2's own
# stylesheets, so cascade order does the rest. If we ever want to
# customize a specific page's structure (e.g. add a wordmark to the
# login form), we'd copy that template from keycloak.v2 and edit it.
#
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css

# Brand metadata surfaced in the login page <title> + the "powered by"
# footer when displayed.
kcLogoIdP-google=fa fa-google
kcButtonClass=pf-c-button kc-button-oriah
