# Oriah API local-dev stack.
#
# One command to bring everything up:   docker compose up -d
# One command to tear everything down:  docker compose down
#
# Run those from the oriah-api root: the root docker-compose.yml is a thin
# `include:` of this file, so every existing command and script keeps working.
# The layout (docker-compose/<env>/docker-compose.yml plus a shared
# common-config.yml) mirrors the course reference; `default/` leaves room for
# a `prod/` or `qa/` sibling later without disturbing this one.
#
# Shared service fragments live in ../common-config.yml -- read that first,
# it explains the `extends` chain and, importantly, why the healthcheck
# `test` deliberately stays per-service.
#
# NOTE on relative paths: they resolve against THIS file's directory, so
# volume sources reach back out with ../../ (oriah-api) and ../../../
# (the repo root, for ../config-repo and ../oriah-web).
#
# Service images for the Spring Boot apps are built via Spring Boot
# Buildpacks (`./mvnw spring-boot:build-image` — see build-images.ps1).
# Run that BEFORE `docker compose up` after any code change.
#
# Network topology (compose creates a user-defined bridge network where
# service names are DNS hostnames):
#
#   ┌─────────── data tier (no deps) ───────────┐
#   │  postgres-* ×13   keycloak   kafka         │
#   │  redis   loki   prometheus   tempo   alloy  │
#   └─────────────────────────────────────────────┘
#                  │                │
#                  ▼                ▼
#   ┌─── platform tier ───┐   ┌─ control plane ┐
#   │   configserver       │   │  eurekaserver  │
#   │   (waits: kafka)     │   │  (no deps)     │
#   └──────────────────────┘   └────────────────┘
#                                      │
#                                      ▼
#                         ┌──── gatewayserver ─────┐
#                         │  waits: eureka, redis  │
#                         └────────────────────────┘
#                                      │
#                                      ▼
#   ┌─── domain tier (waits: configserver, eurekaserver, keycloak, ───┐
#   │    plus its own postgres, plus kafka where it is an event       │
#   │    producer/consumer) ×13                                       │
#   │  checkout additionally waits on the 5 services it calls: cart,  │
#   │  catalog, customer, order and shipping (not payment: since      │
#   │  Phase 7 it places an order and takes no money)                 │
#   └──────────────────────────────────────────────────────────────────┘
#                                      │
#                                      ▼
#                         ┌──────── oriah-web ─────┐
#                         │  waits: gateway, kc    │
#                         └────────────────────────┘
#
# Port map (host → container). Every port is published on 127.0.0.1 only:
# reachable from this PC (DataGrip, Postman, a service in the IDE), never from
# the Wi-Fi it is on. The databases, Redis, Kafka and the object store run
# with development passwords committed here, or none at all.
#   3000 → grafana:3000
#   3100 → loki:3100
#   4000 → oriah-web:3000             # 3000 is taken by grafana on the host
#   5433 → postgres-catalog:5432      # bumped off 5432 so it doesn't clash
#   5434 → postgres-inventory:5432    # with any local postgres install
#   5435 → postgres-customer:5432
#   5436 → postgres-cart:5432
#   5437 → postgres-payment:5432
#   5438 → postgres-order:5432
#   5439 → postgres-promotion:5432
#   5440 → postgres-notification:5432
#   5441 → postgres-review:5432
#   5442 → postgres-search:5432
#   5443 → postgres-keycloak:5432     # Keycloak's own store (logins, roles)
#   5444 → postgres-procurement:5432  # suppliers (the 13th service, Phase 2)
#   5445 → postgres-shipping:5432     # delivery prices by town (Phase 7)
#   5446 → postgres-finance:5432      # the books: expenses, payroll, reports
#   6379 → redis:6379
#   8333 → oriah-s3:8333               # S3 API for product images
#   7080 → keycloak:8080
#   8080 → gatewayserver:8080
#   8081 → catalog:8081               # services are exposed for direct
#   8082 → inventory:8082             # testing; prod would expose only
#   8083 → customer:8083              # the gateway
#   8084 → cart:8084
#   8085 → payment:8085
#   8086 → order:8086
#   8087 → promotion:8087
#   8088 → shipping:8088
#   8089 → checkout:8089
#   8090 → notification:8090
#   8091 → review:8091
#   8092 → search:8092
#   8093 → procurement:8093
#   8094 → finance:8094
#   8761 → eurekaserver:8761
#   8888 → configserver:8888
#   9090 → prometheus:9090
#   9092 → kafka:29092                # HOST listener, for apps run from the IDE
#   3200 → tempo:3200                 # trace query API
#   4317 → tempo:4317                 # OTLP grpc
#   4318 → tempo:4318                 # OTLP http (what the services use)
#  12345 → alloy:12345                # Alloy component-graph UI

services:

  # ─────────────────────────── data tier ───────────────────────────
  #
  # Schema per service: twelve Postgres instances, each owned by exactly one
  # service. No service reads another's tables; cross-service reads go
  # through HTTP or Kafka. Shared settings come from postgres-base-config.

  postgres-catalog:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-catalog
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]

  postgres-inventory:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-inventory
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]

  postgres-customer:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-customer
    environment:
      POSTGRES_DB: customer
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres-customer-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer -d customer"]

  postgres-cart:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-cart
    environment:
      POSTGRES_DB: cart
      POSTGRES_USER: cart
      POSTGRES_PASSWORD: cart
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres-cart-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart -d cart"]

  postgres-payment:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-payment
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]

  postgres-order:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-order
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]

  postgres-promotion:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-promotion
    environment:
      POSTGRES_DB: promotion
      POSTGRES_USER: promotion
      POSTGRES_PASSWORD: promotion
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - postgres-promotion-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promotion -d promotion"]

  postgres-notification:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-notification
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]

  postgres-review:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-review
    environment:
      POSTGRES_DB: review
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
    ports:
      - "127.0.0.1:5441:5432"
    volumes:
      - postgres-review-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review"]

  postgres-search:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-search
    environment:
      POSTGRES_DB: search
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - postgres-search-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d search"]

  # procurement's database: the suppliers Oriah buys from. Host port 5444 is the
  # next free one after Keycloak's 5443 -- services/procurement's
  # application-local.yaml connects to it when the app runs from the IDE.
  postgres-procurement:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-procurement
    environment:
      POSTGRES_DB: procurement
      POSTGRES_USER: procurement
      POSTGRES_PASSWORD: procurement
    ports:
      - "127.0.0.1:5444:5432"
    volumes:
      - postgres-procurement-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procurement -d procurement"]

  # shipping's database: the delivery prices by town and option (Phase 7), which
  # admin publishes and the storefront reads. Host port 5445 is the next free
  # one after procurement's 5444 -- services/shipping's application-local.yaml
  # connects to it when the app runs from the IDE.
  postgres-shipping:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-shipping
    environment:
      POSTGRES_DB: shipping
      POSTGRES_USER: shipping
      POSTGRES_PASSWORD: shipping
    ports:
      - "127.0.0.1:5445:5432"
    volumes:
      - postgres-shipping-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipping -d shipping"]

  # finance's database: the books (admin-only). Host port 5446 is the next free
  # one after shipping's 5445 -- services/finance's application-local.yaml
  # connects to it when the app runs from the IDE.
  postgres-finance:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-finance
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "127.0.0.1:5446:5432"
    volumes:
      - postgres-finance-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]

  # Keycloak's own database. Not a domain service's: it holds every login --
  # the owner, each hire's job role, every customer who registered -- so it
  # must outlive the keycloak container. Before this, Keycloak kept its data
  # inside the container, and any recreate (image bump, env change, down/up)
  # re-imported oriah-realm.json and wiped them all, giving re-created users a
  # new `sub` that orphaned their customer and order rows.
  # scripts/keycloak-persistence-test.ps1 proves a user survives a recreate.
  postgres-keycloak:
    extends:
      file: ../common-config.yml
      service: postgres-base-config
    container_name: oriah-postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "127.0.0.1:5443:5432"
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]

  # ─────────────────────────── object storage ───────────────────────────
  #
  # SeaweedFS in single-binary S3 mode, holding product image bytes.
  #
  # NOT MinIO, which this phase was planned around: its server and client
  # images have been withdrawn from Docker Hub (the minio/ namespace still
  # publishes twenty repositories, but minio/minio and minio/mc are not among
  # them, and an authenticated pull fails exactly as an anonymous one does).
  # catalog talks to the S3 API through the AWS SDK, so the server is a
  # configuration choice and MinIO stays a drop-in if its images return.
  #
  # Published on 127.0.0.1:8333 only, for catalog when it runs from the IDE
  # (profile `local`): that copy of catalog must read and write the same
  # images as the container, or a product photo uploaded in one is missing in
  # the other. Loopback, never the Wi-Fi, because the development credentials
  # are committed to this repository. Browsers still never call it: image
  # bytes are served BY catalog at a relative URL, which keeps the browser,
  # the server-rendering container and any other environment agreeing on one
  # string without an absolute URL in the database.
  oriah-s3:
    extends:
      file: ../common-config.yml
      service: network-deploy-service
    image: chrislusf/seaweedfs:3.80
    container_name: oriah-s3
    # Limit measured 2026-11-11 (scripts/measure-stack.ps1: cold start, the smoke saga, idle): peak 76 MiB = 24% of it.
    mem_limit: 320m
    memswap_limit: 320m
    environment:
      GOMEMLIMIT: 256MiB
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - oriah-s3-data:/data
      # Two identities: an admin that may create buckets, and a bucket-scoped
      # account for catalog that may not. See s3-config/README.md for why that
      # split exists and why this file is mandatory -- the AWS SDK always
      # signs, and SeaweedFS rejects a signed request outright when it has no
      # identities to check it against.
      - ../../s3-config/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # wget, not curl: this image ships wget and nc but NEITHER curl nor
      # bash, which was verified by inspecting the image rather than assumed.
      # The same class of trap as Keycloak's /dev/tcp probe below.
      #
      # 403 is a PASS. Once identities are configured the gateway refuses
      # anonymous requests, so a 403 means the config was read and the service
      # is answering -- which is exactly what readiness means here. wget exits
      # non-zero on 403, hence the explicit acceptance.
      test: ["CMD-SHELL", "wget -q -O- -T2 http://127.0.0.1:8333/ 2>&1 | grep -q . || wget -S -q -O /dev/null -T2 http://127.0.0.1:8333/ 2>&1 | grep -qE '200|403'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # One-shot bucket creation, with the ADMIN identity.
  #
  # A separate container because catalog cannot do this itself: its credentials
  # are scoped to the bucket and receive 403 on a bucket create (measured, not
  # assumed). That is the point of the scoping -- a compromise of catalog
  # cannot create or replace storage locations -- and it is why
  # ObjectStorageConfig FAILS STARTUP on a missing bucket rather than creating
  # one.
  #
  # `weed shell` speaks to the filer rather than the S3 gateway, so the bucket
  # is created as a filer directory under /buckets, which is how SeaweedFS
  # represents an S3 bucket. Idempotent: creating an existing bucket is not an
  # error, so a restart is harmless.
  oriah-s3-init:
    extends:
      file: ../common-config.yml
      service: network-deploy-service
    image: chrislusf/seaweedfs:3.80
    container_name: oriah-s3-init
    # Limit measured 2026-11-11 (scripts/measure-stack.ps1, a cold start): a one-minute job that peaks at 11 MiB = 9% of it.
    mem_limit: 128m
    memswap_limit: 128m
    restart: "no"
    depends_on:
      oriah-s3:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        # -filer is REQUIRED, not optional. weed shell needs both addresses:
        # with only -master it reports
        #   "fail to dial : failed to exit idle mode: passthrough: received
        #    empty target in Build()"
        # and creates nothing. The first version of this script also ended
        # each line with `|| true`, so the container exited 0 having done
        # nothing at all -- catalog then started and failed its own bucket
        # check with a confusing error instead of this one.
        #
        # RETRIED, because the readiness check above and this job look at
        # different ports. The check probes the S3 gateway on 8333, which opens
        # first; weed shell needs the filer's gRPC, which opens a moment later.
        # Starting right after "healthy" therefore failed on a cold start (it
        # did, 2 starts out of 2), and with a one-shot script that meant catalog
        # never started. Waiting is correct here: the filer is on its way up.
        #
        # What counts as success is the bucket being LISTED afterwards, not
        # weed shell's exit status: weed shell can exit 0 having done nothing
        # (see above). s3.bucket.create is idempotent (a second run reports
        # success for an existing bucket), so a restart or a retry is harmless.
        # Bounded: 30 tries about 3 s apart is roughly a minute and a half, and
        # then the container exits non-zero, which blocks catalog with the real
        # cause. (In this file a literal dollar sign for the shell is written as two.)
        #
        # Each attempt is also bounded to 20 s: weed shell waits for its master with no
        # deadline of its own, so an attempt made while oriah-s3 is restarting would
        # otherwise hang the loop forever and leave catalog waiting with no message.
        # (busybox's timeout is used when the image has it.)
        bounded() {
          if command -v timeout >/dev/null 2>&1; then timeout 20 "$$@"; else "$$@"; fi
        }
        tries=0
        until echo 's3.bucket.create -name oriah-catalog' | bounded weed shell -master=oriah-s3:9333 -filer=oriah-s3:8888 \
              && echo 's3.bucket.list' | bounded weed shell -master=oriah-s3:9333 -filer=oriah-s3:8888 | grep -q oriah-catalog
        do
          tries=$$((tries + 1))
          if [ "$$tries" -ge 30 ]; then
            echo "oriah-s3-init: bucket oriah-catalog is still not listed after $$tries tries; giving up" >&2
            exit 1
          fi
          echo "oriah-s3-init: the filer is not ready yet (try $$tries of 30); waiting 3 s"
          sleep 3
        done
        echo "bucket oriah-catalog is present"

  keycloak:
    extends:
      file: ../common-config.yml
      service: network-deploy-service
    image: quay.io/keycloak/keycloak:26.0
    container_name: oriah-keycloak
    # Limit measured 2026-11-11 (scripts/measure-stack.ps1: cold start, the smoke saga, idle): peak 584 MiB = 46% of it.
    mem_limit: 1280m
    memswap_limit: 1280m
    # start-dev: no caching, hot-reload, plain HTTP -- local development only.
    # Production runs `start` (optimized build, hostname and TLS/proxy set) on
    # the same database settings below.
    # --import-realm: imports the realm only when it does NOT yet exist in the
    # database -- keycloak/import/oriah-realm.json (every role, both clients,
    # the machine identity; no person, no secret) plus, in this DEV stack only,
    # keycloak/dev/oriah-users-0.json (the people the smoke test and Playwright
    # sign in as), mounted beside it below. Now that the database persists,
    # editing either file no longer changes a running realm. During
    # development, apply a realm edit by removing ONLY Keycloak's volume and
    # starting again:
    #   docker compose rm -sf keycloak postgres-keycloak
    #   docker volume rm default_postgres-keycloak-data
    #   docker compose up -d keycloak
    # then restart order (docker compose restart order) -- its cached machine
    # token was signed by the old keys. Removing that one volume wipes dev
    # logins, never the twelve domain databases. Never `docker compose down -v`
    # (it wipes all thirteen databases); never a console edit (it drifts from the
    # committed files).
    # After go-live a realm change is applied by an idempotent admin-API step
    # instead.
    command: ["start-dev", "--import-realm"]
    environment:
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx512m"
      # Bootstrap admin credentials (Keycloak 26+ uses KC_BOOTSTRAP_* naming).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # iss-claim hostname. Every token Keycloak issues will carry
      # iss=http://localhost:7080/realms/oriah, regardless of which network
      # the token was requested over. Services trust that iss; JWKS lookup
      # is over the internal network (see application-docker.yaml).
      KC_HOSTNAME: http://localhost:7080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Persistent store: Keycloak's own Postgres, never the container's
      # filesystem (see postgres-keycloak above).
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # oriah-admin's client secret. The committed realm carries only the
      # placeholder ${ORIAH_ADMIN_CLIENT_SECRET}, which Keycloak fills from this
      # variable at import. This is the DEVELOPMENT value, and it must match
      # order's ORIAH_SERVICE_CLIENT_SECRET below and the scripts that sign in.
      # Production never uses it: there, an unset variable must stop the stack
      # -- `${ORIAH_ADMIN_CLIENT_SECRET:?...}` -- because Keycloak would
      # otherwise store the placeholder TEXT as a working secret; and the
      # go-live step (scripts/keycloak-go-live.ps1) sets the real one.
      ORIAH_ADMIN_CLIENT_SECRET: oriah-admin-secret
      # The same for notification's own machine client (Phase 11): the dev value, matching notification's
      # ORIAH_NOTIFICATION_CLIENT_SECRET below. A production compose must refuse to start without it, like the one above.
      ORIAH_NOTIFICATION_CLIENT_SECRET: oriah-notification-secret
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:7080:8080"
    volumes:
      # The realm, and the dev-only users file beside it -- each mounted on its
      # own, read-only. A file mounted INSIDE a read-only folder mount stops the
      # container from starting, and a writable folder would leave an empty
      # placeholder file in the repo. The users file must keep its name:
      # Keycloak pairs <realm>-users-<n>.json with <realm>-realm.json.
      - ../../keycloak/import/oriah-realm.json:/opt/keycloak/data/import/oriah-realm.json:ro
      - ../../keycloak/dev/oriah-users-0.json:/opt/keycloak/data/import/oriah-users-0.json:ro
      # Custom "oriah" theme (login/account/email) -- referenced by
      # the realm via loginTheme=oriah / accountTheme=oriah /
      # emailTheme=oriah. Mounted read-only so accidental changes
      # inside the container don't survive a restart.
      - ../../keycloak/themes/oriah:/opt/keycloak/themes/oriah:ro
    healthcheck:
      # Keycloak 26 UBI ships bash but not curl/wget. We use bash to open
      # a raw TCP socket, send a one-line HTTP request to /realms/master,
      # read the status line, and look for "200". This tells us realm
      # discovery is live (= realm import finished), not just that the
      # port is bound (which happens earlier).
      # Compose variable-interpolates $VAR at parse time. To pass a literal
      # $ to bash (so $line is read as a shell variable, not interpolated to
      # empty by compose), double it: $$line.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r line <&3 && echo \"$$line\" | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  prometheus:
    # Pulls /actuator/prometheus from every Spring service every 15s
    # and stores time series in-memory + on a small volume. Targets
    # are listed in monitoring/prometheus.yml; add a new service to
    # the stack by appending one line there. UI on http://localhost:9090.
    extends:
      file: ../common-config.yml
      service: network-deploy-service
    image: prom/prometheus:latest
    container_name: oriah-prometheus
    # Limit measured 2026-11-11 (scripts/measure-stack.ps1: cold start, the smoke saga, idle): peak 83 MiB = 16% of it.
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      GOMEMLIMIT: 400MiB
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ../../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      # Prometheus is built on a stripped Alpine without bash but it
      # ships wget. /-/healthy is the documented liveness endpoint.
      test: ["CMD", "wget", "--quiet", "--spider", "--tries=1", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  grafana:
    # Pre-provisioned with the Prometheus datasource and one starter
    # dashboard (Oriah Backend Overview: HTTP req-rate + p95 latency +
    # JVM heap + Kafka consumer lag, per service). Open
    # http://localhost:3000 -- admin/admin on first login, then it
    # forces a password change.
    extends:
      file: ../common-config.yml
      service: network-deploy-service
    image: grafana/grafana:latest
    container_name: oriah-grafana
    # Limit measured 2026-11-11 (scripts/measure-stack.ps1: cold start, the smoke saga, idle): peak 287 MiB = 75% of it.
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      GOMEMLIMIT: 300MiB
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Suppress the first-login forced password change for the local
      # dev workflow. In prod you definitely want this on.
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - ../../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --tries=1 http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  loki:
    # Grafana Loki -- log aggregation backend. Single-binary mode with
    # the filesystem object store; storage lives on a docker volume so
    # restarts don't lose history. Port 3100 takes the push API and
    # serves the LogQL query API Grafana proxies to.
    extends:
      file: ../common-config.yml
      service: network-deploy-service
    image: grafana/loki:latest
    container_name: oriah-loki
    # Limit measured 2026-11-11 (scripts/measure-stack.ps1: cold start, the smoke saga, idle): peak 118 MiB = 31% of it.
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      GOMEMLIMIT: 300MiB
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ../../monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    # No healthcheck: the grafana/loki image is fully distroless --
    # no shell, no wget, no ls -- so docker has nothing to exec to
    # probe /ready. Alloy depends on service_started instead of
    # service_healthy; on first start it retries pushing for a few
    # seconds while Loki's ingester ring warms up, which is fine.

  redis:
    # Backing store for Spring Cloud Gateway's RedisRateLimiter on the
    # public storefront routes (/api/v1/products/**, /api/v1/search/**).
    # No persistence config -- rate-limit state is intentionally
    # ephemeral; on restart the bucket resets, which is fine for dev.
    extends:
      file: ../common-config.yml
      service: network-deploy-service
    image: redis:7-alpine
    container_name: oriah-redis
    # Limit measured 2026-11-11 (scripts/measure-stack.ps1: cold start, the smoke saga, idle): peak 12 MiB = 19% of it.
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailcatcher:
    # Catches every email the development stack sends, and delivers none (Phase 11). Notification, while it is not live, can talk to no
    # other mail server than this one, and hands it only addresses on names reserved for testing. Read what was caught at
    # http://localhost:8025. No relay is configured, on purpose: the registry guard refuses a line here that would set one, or that
    # would make the stack live or give it a real mail account.
    extends:
      file: ../common-config.yml
      service: network-deploy-service
    # Pinned, never :latest.
    image: axllent/mailpit:v1.21
    container_name: oriah-mailcatcher
    # Limit measured 2026-11-17 (scripts/measure-stack.ps1 during a full smoke run): about 17 MiB idle, peak 41 MiB while taking a few dozen
    # messages. It may hold 500, which was not measured, so the limit leaves three times the measured peak.
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      # Keep the newest 500 messages; a long-lived development stack must not fill its disk with test mail.
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    # Apache Kafka in KRaft mode (no ZooKeeper). 4.x replaced ZK with a
    # self-managed Raft quorum; one container is the broker AND the
    # controller for local-dev. apache/kafka:* is the official image.
    extends:
      file: ../common-config.yml
      service: network-deploy-service
    image: apache/kafka:3.9.0
    container_name: oriah-kafka
    # Limit measured 2026-11-11 (scripts/measure-stack.ps1: cold start, the smoke saga, idle): peak 504 MiB = 56% of it.
    mem_limit: 896m
    memswap_limit: 896m
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      # Required KRaft single-node config — node-id 1 is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      # Three listeners:
      #   PLAINTEXT  — 9092 inside the network, advertised as kafka:9092, for
      #                the services running in containers.
      #   HOST       — 29092 inside the container, published as the PC's
      #                localhost:9092 and advertised as localhost:9092, for a
      #                service started from the IDE (profile `local`).
      #   CONTROLLER — internal Raft quorum on 9093.
      # Advertised listeners are what a client is told to use after its first
      # connection. With only kafka:9092 advertised, a program on the PC
      # connects, is told "use kafka:9092", cannot resolve it, and every send
      # times out -- while a topic listing still works, which is why
      # scripts/local-dev/KafkaHostProbe.java sends a real record and reads it
      # back (red before this listener, green after).
      KAFKA_LISTENERS: "PLAINTEXT://:9092,HOST://:29092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Single-node sane defaults — these are all "1" because there's only one broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # KRaft requires a 22-char URL-safe-base64 cluster id (the format
      # `kafka-storage random-uuid` produces). Generated once and pinned
      # so the metadata log on the host volume stays bound to this id
      # across container restarts.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      # The PC's 9092 is the HOST listener (container 29092), not PLAINTEXT.
      - "127.0.0.1:9092:29092"
    healthcheck:
      # The apache/kafka image ships bash + nc-style /dev/tcp via bash.
      # Brokers bind 9092 only after the controller comes up, so this
      # check covers full readiness, not just process-started.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  tempo:
    # Grafana Tempo — trace storage, replacing Zipkin. Ingests OTLP natively,
    # which is what our spans already are: Micrometer Tracing's OpenTelemetry
    # bridge produces OTel spans that were only being translated into Zipkin's
    # v2 wire format on the way out.
    #
    # The swap from Zipkin was staged, not cut over: OTLP export was added
    # while Zipkin still ran, SpanExporterCoexistenceTest confirmed both
    # exporters were wired at once, and the smoke test proved the same traceId
    # reached Tempo across all seven saga services before Zipkin was removed.
    # So the end-to-end trace assertion never went dark, not even for one
    # commit.
    extends:
      file: ../common-config.yml
      service: network-deploy-service
    # Pinned, not :latest. `latest` resolved to v3.0.0, which restructured the
    # config and refused to start on the ingester/compactor sections that every
    # Tempo 2.x example uses. See the header of monitoring/tempo/tempo.yml.
    image: grafana/tempo:3.0.0
    container_name: oriah-tempo
    # Limit measured 2026-11-11 (scripts/measure-stack.ps1: cold start, the smoke saga, idle): peak 293 MiB = 76% of it.
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      GOMEMLIMIT: 300MiB
    command: ["-config.file=/etc/tempo/tempo.yml"]
    # The image runs as uid 10001, but a named volume is created root-owned, so
    # Tempo cannot write its WAL and exits. Running as root is the pragmatic
    # local-dev fix; a real deployment would pre-chown the mount or use an
    # object-store backend and no local volume at all.
    user: root
    volumes:
      - ../../monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      # 3200 is the query API Grafana reads and the smoke test asserts against.
      - "127.0.0.1:3200:3200"
      # 4318 is the one the services actually use: the OTLP transport property
      # defaults to http, so the wired bean is OtlpHttpSpanExporter. 4317 (grpc)
      # is published anyway because it costs nothing and is the first thing
      # you'd want if the transport were ever switched.
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    # No healthcheck: grafana/tempo is distroless — no shell, no wget — so
    # docker has nothing to exec. Same situation as loki below. Readiness is
    # asserted over HTTP from the host in smoke-test.ps1 instead.

  alloy:
    # Grafana Alloy — log shipping, replacing Promtail (which is EOL: Grafana
    # stopped feature development in favour of Alloy). This is the
    # modernization the brief asked for in place of the course's Promtail.
    #
    # Both shippers ran during the overlap, each labelling its streams
    # (shipper="alloy" / shipper="promtail") so Loki queries could tell them
    # apart -- without that every line would have existed twice and every
    # log-rate panel would have silently doubled. Promtail is gone now, but the
    # label stays: it is what proved Alloy was really working, the smoke test
    # still asserts on it, and it keeps the query honest if a second shipper is
    # ever added again.
    extends:
      file: ../common-config.yml
      service: network-deploy-service
    image: grafana/alloy:latest
    container_name: oriah-alloy
    # Limit measured 2026-11-11 (scripts/measure-stack.ps1: cold start, the smoke saga, idle): peak 120 MiB = 47% of it.
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      GOMEMLIMIT: 200MiB
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../../monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # discovery.docker + loki.source.docker enumerate containers and tail
      # their logs through the Docker API. Not a bind-mount of
      # /var/lib/docker/containers: on Docker Desktop those files live inside
      # the WSL2 VM and are not reliably reachable from a container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      # http://localhost:12345/graph renders the live component graph with
      # per-component health — the fastest way to see whether discovery found
      # containers and whether writes to Loki are succeeding.
      - "127.0.0.1:12345:12345"
    depends_on:
      loki:
        condition: service_started

  # ───────────────────────── platform tier ─────────────────────────
  #
  # configserver and eurekaserver take microservice-base-config, not the
  # configserver/eureka layers: neither bootstraps from the other, and the
  # Config Server obviously cannot wait for itself.

  configserver:
    extends:
      file: ../common-config.yml
      service: microservice-base-config
    image: oriah/configserver:dev
    container_name: oriah-configserver
    environment:
      # Spring Cloud Config's git backend reads from the path mounted
      # below, so dev works without GitHub auth; production would point at an
      # https://... remote and behave the same way.
      #
      # A plain PATH, deliberately NOT a file:// URL. Spring Cloud Config reads a
      # file:// repository in place and never clones it, so every request ran
      # several git commands against the Windows folder mounted below (about 10 s
      # each on this PC); thirteen services asking at once queued behind one
      # another and the last ones died with "Read timed out" (2026-11-11). A plain
      # path makes the server clone ONCE, at start, into the container's own disk
      # and fetch from the mount at most every CONFIG_REPO_REFRESH_RATE seconds
      # (default 10). The cost: only what is COMMITTED in config-repo reaches the
      # services (an uncommitted edit does not), and a commit reaches them within
      # 10 s. ConfigServerGitBackendTest pins all of this.
      CONFIG_REPO_URI: /workspace/config-repo
      CONFIG_REPO_BRANCH: master
      # Tracing endpoint set directly here because configserver can't
      # bootstrap from itself — the 13 service modules inherit these
      # values via config-repo/application.yaml, but the platform tier
      # has to be told via env.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      # OTLP to Tempo. Set here as well as in config-repo because the platform
      # tier cannot bootstrap its own configuration from the Config Server.
      # Port 4318 (http), not 4317 (grpc): the transport property defaults to
      # http, so the wired exporter is OtlpHttpSpanExporter.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://tempo:4318/v1/traces"
    depends_on:
      # Spring Cloud Bus publishes /actuator/busrefresh broadcasts on
      # the springCloudBus Kafka topic; without kafka up the bus
      # producer fails on startup.
      kafka:
        condition: service_healthy
    volumes:
      # Read-only mount of the local config-repo: the server CLONES it into its
      # own disk (see CONFIG_REPO_URI above) and only ever reads from here, so it
      # can no longer write an index or lock file back into the host's repository.
      # (It was read-write while the URI was file://, which JGit uses in place.)
      # The host edits and commits normally.
      - ../../../config-repo:/workspace/config-repo:ro
    ports:
      - "127.0.0.1:8888:8888"
    healthcheck:
      # bash + coreutils come from paketo run-noble-base (set per build in
      # build-images.ps1). The default run-jammy-tiny has none of these.
      # `/dev/tcp/<host>/<port>` is a bash builtin — opens a TCP socket. No
      # curl needed (noble-base doesn't ship curl either).
      #
      # A REAL request, not just "is the port open". The port opens well before
      # the Config Server can read the config repo, and every service waits on
      # this check: with a bare TCP probe they started the moment 8888 accepted
      # a connection, asked for their config, and died with "Read timed out"
      # because the first answer takes several seconds on a cold start. So this
      # asks for a real configuration, /customer/docker (any application name
      # works; the Config Server answers 200 only if it can serve from the repo
      # and 500 if it cannot), and requires the status to be EXACTLY 200: the
      # status token is parsed out of the response line and compared as a
      # whole, not grepped for the characters 200, which would also match "500"
      # in "HTTP/1.0 500 ... 200 ms". Anything after the digits is dropped first
      # (a status line of just "200" ends in a carriage return), so a server that
      # writes no reason phrase is still a 200.
      # Same quoting as Keycloak's probe below: $$ is a literal $ for bash
      # (Compose would otherwise read $status as an empty variable), and \\r\\n
      # is how a backslash gets through to printf.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8888 && printf 'GET /customer/docker HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r proto status rest <&3 && [ \"$${status%%[!0-9]*}\" = 200 ]"]
      interval: 10s
      # Above the slowest first answer, so a slow cold start is waited for
      # rather than counted as a failure. (The shared default is shorter.)
      timeout: 20s
      retries: 30
      start_period: 60s

  eurekaserver:
    extends:
      file: ../common-config.yml
      service: microservice-base-config
    image: oriah/eurekaserver:dev
    container_name: oriah-eurekaserver
    # Limit measured 2026-11-11 (scripts/measure-stack.ps1: cold start, the smoke saga, idle): peak 279 MiB = 54% of it.
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      # Tracing direct-set: eureka doesn't pull from configserver.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      # OTLP to Tempo. Set here as well as in config-repo because the platform
      # tier cannot bootstrap its own configuration from the Config Server.
      # Port 4318 (http), not 4317 (grpc): the transport property defaults to
      # http, so the wired exporter is OtlpHttpSpanExporter.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://tempo:4318/v1/traces"
    ports:
      - "127.0.0.1:8761:8761"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8761"]
      start_period: 60s

  gatewayserver:
    # Declares its own dependencies rather than taking
    # microservice-eureka-config: the gateway needs service discovery and
    # Redis (for the rate limiter) but does NOT fetch config from the
    # Config Server, so the configserver layer would add a dependency it
    # does not have.
    extends:
      file: ../common-config.yml
      service: microservice-base-config
    image: oriah/gatewayserver:dev
    container_name: oriah-gatewayserver
    # Limit measured 2026-11-11 (scripts/measure-stack.ps1: cold start, the smoke saga, idle): peak 353 MiB = 46% of it.
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      # Tracing direct-set: gateway doesn't pull from configserver.
      # The gateway is the trace entrypoint — Micrometer Tracing's
      # WebFlux instrumentation creates the root span and propagates
      # traceparent headers to every backend service via the route.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      # OTLP to Tempo. Set here as well as in config-repo because the platform
      # tier cannot bootstrap its own configuration from the Config Server.
      # Port 4318 (http), not 4317 (grpc): the transport property defaults to
      # http, so the wired exporter is OtlpHttpSpanExporter.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: "http://tempo:4318/v1/traces"
      # NB: -XX:MaxDirectMemorySize=128m is baked into the image at
      # build time via BPE_APPEND_JAVA_TOOL_OPTIONS in
      # infra/gatewayserver/pom.xml -- see the comment there for the
      # full root cause (Paketo calculator hardcodes 10M direct,
      # which is too small for the reactive Netty pipeline). No env
      # override needed here anymore.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      eurekaserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      start_period: 60s

  # ───────────────────────── domain tier ───────────────────────────
  #
  # All 13 take microservice-keycloak-config, which supplies the
  # configserver + eurekaserver + keycloak dependency triple, the docker
  # profile, the network and the healthcheck cadence. Each adds only what is
  # genuinely its own: its Postgres, Kafka if it produces or consumes events,
  # its port, and its probe.

  catalog:
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/catalog:dev
    container_name: oriah-catalog
    # Larger than the other Java modules on purpose: catalog decodes uploaded photographs in
    # memory. The biggest it accepts is 8000 x 5000 (40 megapixels), which needs about 306 MiB
    # of heap while it is decoded, turned upright and saved. Measured 2026-11-11 with
    # scripts/ingest-load-test.ps1 (details in docs/MVP_PLAN.md Phase 2): without a gate 124
    # large uploads at once killed the JVM (OutOfMemoryError); with the gate but a 1 GiB
    # container (575 MiB heap) a SINGLE biggest picture pushed the heap to 79% and cost 16 full
    # collections, 30% of its time. At 1.5 GiB Paketo gives catalog about 1 GiB of heap, and
    # catalog's IngestGate budget below is 600 MiB of it: two big pictures never run at once, the
    # rest wait, then get 503 + Retry-After. Raise the limit and the budget together.
    mem_limit: 1536m
    memswap_limit: 1536m
    environment:
      # IngestGate budget (catalog.images.ingest.working-memory-mib), about 60% of the heap.
      CATALOG_IMAGES_INGEST_WORKING_MEMORY_MIB: "600"
      # The bucket-SCOPED identity, not the storage admin. Development values;
      # see s3-config/README.md.
      CATALOG_S3_ACCESS_KEY: catalogkey
      CATALOG_S3_SECRET_KEY: catalogsecret
      # Compose-managed secret. Override in a .env file for non-default values.
      SPRING_DATASOURCE_USERNAME: catalog
      SPRING_DATASOURCE_PASSWORD: catalog
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      # The bucket must exist before catalog starts: it checks for the bucket
      # at startup and refuses to run without it, because accepting uploads
      # into storage that is not there would answer 201 to an admin and lose
      # the file.
      oriah-s3-init:
        condition: service_completed_successfully
      postgres-catalog:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081"]
      start_period: 90s

  inventory:
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/inventory:dev
    container_name: oriah-inventory
    # Memory: keeps the shared 640m (common-config.yml). Re-measured 2026-11-13 after Phase 5 made inventory
    # cost-bearing (three Kafka consumers, a replay at start, a ledger engine that reads every live action of a
    # variant): the container read 486 MiB after the smoke test (76%), and a worst-case burst, 122 write-offs on ONE
    # variant by four writers at once (26 more were told to retry, as designed) and then a correction that re-cut
    # all 122, moved it to 492 MiB (77%) and finished in about 6 s with no count out of line with its lots. Inside
    # the JVM: heap 86 of 217 MiB, class metadata 153 of 186, code cache 38 of 64, 55 threads (peak 57) of a
    # 125-thread budget: the same shape as the other ordinary services. There is no large payload here (unlike
    # procurement's invoices or catalog's photographs), so no native-memory burst to size a bigger limit for.
    environment:
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventory
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgres-inventory:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082"]
      start_period: 90s

  customer:
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/customer:dev
    container_name: oriah-customer
    environment:
      SPRING_DATASOURCE_USERNAME: customer
      SPRING_DATASOURCE_PASSWORD: customer
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      postgres-customer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8083"]
      start_period: 90s

  cart:
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/cart:dev
    container_name: oriah-cart
    environment:
      SPRING_DATASOURCE_USERNAME: cart
      SPRING_DATASOURCE_PASSWORD: cart
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      postgres-cart:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8084"]
      start_period: 90s

  payment:
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/payment:dev
    container_name: oriah-payment
    environment:
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: payment
      # Phase 13: payments through ZynlePay. This stack is NEVER live: it talks to payment's own stand-in for ZynlePay (SIMULATOR mode, the
      # default), which runs inside this container under /internal/zynlepay-sim and takes no real credentials. ORIAH_ZYNLEPAY_LIVE and the
      # ORIAH_ZYNLEPAY_* credentials must never appear in this file (scripts/check_service_registry.py refuses them).
      #
      # The stand-in sends its "payment done" messages to the gateway, as ZynlePay would from outside, so the public callback path is proved
      # end to end.
      ORIAH_PAYMENT_ZYNLEPAY_SIM_CALLBACKURL: http://gatewayserver:8080/api/v1/payments/zynlepay/callback
      # The smoke test starts many payments from the same few people and numbers in one run.
      ORIAH_PAYMENT_ZYNLEPAY_LIMITS_STARTSPERSHOPPERPERHOUR: "500"
      ORIAH_PAYMENT_ZYNLEPAY_LIMITS_STARTSPERNUMBERPERHOUR: "500"
      # A development clock: ZynlePay is asked every few seconds, and a payment it never answers becomes the owner's after one minute (thirty
      # in production), so the smoke test can see it happen. give-up-after may not be shorter than fast-for, so those are lowered with it.
      ORIAH_PAYMENT_ZYNLEPAY_POLL_DELAY: "2000"
      ORIAH_PAYMENT_ZYNLEPAY_POLL_FIRSTCHECKAFTER: PT3S
      ORIAH_PAYMENT_ZYNLEPAY_POLL_FASTEVERY: PT3S
      ORIAH_PAYMENT_ZYNLEPAY_POLL_SLOWEVERY: PT5S
      ORIAH_PAYMENT_ZYNLEPAY_POLL_INDETERMINATEWAIT: PT5S
      ORIAH_PAYMENT_ZYNLEPAY_POLL_FASTFOR_MOBILEMONEY: PT1M
      ORIAH_PAYMENT_ZYNLEPAY_POLL_FASTFOR_CARD: PT1M
      ORIAH_PAYMENT_ZYNLEPAY_POLL_GIVEUPAFTER: PT1M
      ORIAH_PAYMENT_ZYNLEPAY_POLL_CALLBACKMINGAP: PT2S
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8085"]
      start_period: 90s

  order:
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/order:dev
    container_name: oriah-order
    environment:
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orders
      # Order's own client-credentials secret for its calls to shipping (Phase 0,
      # item 4.2). The DEVELOPMENT value of the dev realm; production's is
      # generated at go-live and injected from outside Git.
      ORIAH_SERVICE_CLIENT_SECRET: oriah-admin-secret
    ports:
      - "127.0.0.1:8086:8086"
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8086"]
      start_period: 90s

  promotion:
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/promotion:dev
    container_name: oriah-promotion
    environment:
      SPRING_DATASOURCE_USERNAME: promotion
      SPRING_DATASOURCE_PASSWORD: promotion
    ports:
      - "127.0.0.1:8087:8087"
    depends_on:
      postgres-promotion:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8087"]
      start_period: 90s

  shipping:
    # Owns a database since Phase 7: the delivery prices by town and option, so it waits
    # for its own Postgres (and, like promotion and review, for nothing else: it
    # has no Kafka in its pom yet). Until prices are published it offers Zambia
    # one option, SELF_COLLECT at K0, and refuses any other country (422
    # outside-delivery-area); there is no rate card or zone list.
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/shipping:dev
    container_name: oriah-shipping
    environment:
      SPRING_DATASOURCE_USERNAME: shipping
      SPRING_DATASOURCE_PASSWORD: shipping
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      postgres-shipping:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8088"]
      start_period: 90s

  checkout:
    # Prices the bag and places the order: stateless (no Postgres of its own)
    # but it must wait for every service it calls (cart, catalog, customer,
    # shipping and order; payment is none of them), or the first checkout
    # preview after a cold start fails on a connection refused rather than a
    # clean fallback.
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/checkout:dev
    container_name: oriah-checkout
    ports:
      - "127.0.0.1:8089:8089"
    depends_on:
      cart:
        condition: service_healthy
      catalog:
        condition: service_healthy
      customer:
        condition: service_healthy
      order:
        condition: service_healthy
      shipping:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8089"]
      start_period: 90s

  notification:
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/notification:dev
    container_name: oriah-notification
    # Memory: the shared 640m limit. Measured again 2026-11-17 on the Phase 11 code (a mail client, two scheduled jobs, two Kafka
    # bindings), scripts/measure-stack.ps1 over the second half of a full smoke run and the idle time after it: peak 462 MiB = 72% of it.
    environment:
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      # Notification's own machine identity (it asks catalog which pieces are priced below cost): the dev value, the same one
      # Keycloak's environment above fills the realm's placeholder with.
      ORIAH_NOTIFICATION_CLIENT_SECRET: oriah-notification-secret
      # Who is told, on this stack: two mailboxes that exist only in the mail catcher. In production these two lists are real
      # mailboxes and come from the environment only, never from a settings file.
      ORIAH_ALERT_EMAILS_MONEY: alerts-money@oriah.local
      ORIAH_ALERT_EMAILS_COST: alerts-cost@oriah.local
      # The storefront, for the link at the foot of a customer's email.
      ORIAH_NOTIFICATION_SITE_URL: http://localhost:4000
      # A development stack is used hard: the daily limit of payment-claim emails is raised (it cannot be switched off), and the
      # below-cost check runs every minute instead of every five so the smoke test need not wait.
      ORIAH_NOTIFICATION_CLAIM_ALERTS_PER_DAY: "500"
      ORIAH_NOTIFICATION_BELOW_COST_DELAY: "60000"
      ORIAH_NOTIFICATION_BELOW_COST_INITIAL_DELAY: "60000"
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8090"]
      start_period: 90s

  review:
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/review:dev
    container_name: oriah-review
    environment:
      SPRING_DATASOURCE_USERNAME: review
      SPRING_DATASOURCE_PASSWORD: review
    ports:
      - "127.0.0.1:8091:8091"
    depends_on:
      postgres-review:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8091"]
      start_period: 90s

  search:
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/search:dev
    container_name: oriah-search
    environment:
      SPRING_DATASOURCE_USERNAME: search
      SPRING_DATASOURCE_PASSWORD: search
    ports:
      - "127.0.0.1:8092:8092"
    depends_on:
      postgres-search:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8092"]
      start_period: 90s

  procurement:
    # Suppliers, purchase orders, consignments, the landed-cost allocator and invoices
    # (Phases 2 and 4). It waits for its own Postgres AND for Kafka: receiving a
    # consignment appends consignment.received to its outbox, and the relay publishes it.
    # Kafka being down at that moment is safe (the event stays in the outbox and goes out
    # when Kafka is back); it starts after Kafka only so that its relay and its replay
    # listener find a broker at start, as every other service that publishes events does.
    #
    # It also calls catalog (a variant lookup, Feign, by name through Eureka) when a line is
    # placed. That is a call at request time, not a start-up dependency: no depends_on.
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/procurement:dev
    container_name: oriah-procurement
    # 768 MiB, not the 640 MiB default: invoices are uploaded at up to 5 MB, and an upload is held in memory
    # about three times over while it is read, fingerprinted and written. Measured 2026-11-12 on the rebuilt
    # stack with a script that sends 16 5 MB PDFs at once. With no limit, half of them were a 500 and the
    # container read 614 MiB of its 640 MiB (96%). With a gate of four every upload succeeded (`docker stats`
    # 605 MiB after the first burst, from an idle 537 MiB; the kernel's count of the process's anonymous memory
    # went from 430 MiB to 592 MiB), and the second burst was killed by the kernel (exit 137, OOMKilled) even
    # though the Java heap never passed 178 of its 217 MiB: the rest is native memory (thread stacks, malloc
    # arenas, the heap's own committed pages). UploadGate (oriah.procurement.uploads.max-concurrent, default 2)
    # keeps the heap safe; this limit keeps the container alive. Re-measured at 768 MiB with two at a time:
    # six bursts of 16 in a row, every upload 201, no restart, plateau about 714 MiB (93%), heap peak 235 of
    # its 335 MiB ceiling, idle 437 MiB. See docs/MVP_PLAN.md Phase 4.
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      SPRING_DATASOURCE_USERNAME: procurement
      SPRING_DATASOURCE_PASSWORD: procurement
    ports:
      - "127.0.0.1:8093:8093"
    depends_on:
      postgres-procurement:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8093"]
      start_period: 90s

  finance:
    # The books: expenses, payroll and financial reports. Admin-only (FINANCE_ADMIN); it waits
    # for its own Postgres AND for Kafka, as every other service that publishes events does.
    extends:
      file: ../common-config.yml
      service: microservice-keycloak-config
    image: oriah/finance:dev
    container_name: oriah-finance
    environment:
      SPRING_DATASOURCE_USERNAME: finance
      SPRING_DATASOURCE_PASSWORD: finance
    ports:
      - "127.0.0.1:8094:8094"
    depends_on:
      postgres-finance:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8094"]
      start_period: 90s

  # ─────────────────────────── frontend tier ───────────────────────────

  oriah-web:
    # Next.js 15 storefront + admin. See ../oriah-web/CLAUDE.md for
    # the stack. Built from ../oriah-web/Dockerfile (multi-stage,
    # standalone output, ~150MB final). Build with:
    #   docker compose build oriah-web
    extends:
      file: ../common-config.yml
      service: network-deploy-service
    image: oriah/oriah-web:dev
    build:
      context: ../../../oriah-web
      dockerfile: Dockerfile
    container_name: oriah-web
    # Limit measured 2026-11-11 (scripts/measure-stack.ps1: cold start, the smoke saga, idle): peak 82 MiB = 21% of it.
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      NODE_OPTIONS: "--max-old-space-size=256"
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: "1"

      # Auth.js secret. Override in production via an env-file / docker
      # secret; the default here is a placeholder so the container
      # boots in dev without manual setup.
      AUTH_SECRET: ${ORIAH_WEB_AUTH_SECRET:-dev-secret-replace-me-with-32-bytes-of-random}
      # Auth.js v5 trusts X-Forwarded-Host when this is true; required
      # behind the docker port mapping (container sees PORT=3000 but
      # the browser hits localhost:4000).
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://localhost:4000

      # Keycloak's iss claim is `http://localhost:7080/...` (set via
      # KC_HOSTNAME on the keycloak service) -- both the host browser
      # and this container must agree on that URL so iss validation
      # passes. extra_hosts: localhost:host-gateway below lets the
      # container resolve `localhost:7080` to the docker host's
      # exposed Keycloak port. The Spring services dodge this by
      # splitting issuer-uri (validation) from jwk-set-uri (fetch);
      # Auth.js doesn't expose that split cleanly, so we route both
      # through the host. Trade-off: one extra hop (container ->
      # host -> keycloak) for the OIDC discovery + token exchange,
      # which only happens at login.
      KEYCLOAK_ISSUER: http://localhost:7080/realms/oriah
      KEYCLOAK_CLIENT_ID: oriah-web

      # RSC + Server Actions fetch the gateway via internal Docker
      # DNS -- no host roundtrip. Browser-side /api/* requests come
      # in through Next.js rewrites (next.config.js) and use the
      # same URL on the server end.
      INTERNAL_API_BASE_URL: http://gatewayserver:8080
      NEXT_PUBLIC_API_BASE_URL: /api
    ports:
      # Host 4000 -> container 3000. Avoids the Grafana :3000 host
      # port (which is what made the brief pick 4000 in the first
      # place).
      - "127.0.0.1:4000:3000"
    extra_hosts:
      # Lets the container resolve `localhost` to the docker host so
      # KEYCLOAK_ISSUER=http://localhost:7080/... works in here.
      # `host-gateway` is the magic value Docker resolves to the host
      # bridge IP at container start.
      - "localhost:host-gateway"
    depends_on:
      gatewayserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # /api/auth/session is the smallest always-200 endpoint Auth.js
      # exposes; if it 200s, the Node server + Auth.js routes are up.
      # 127.0.0.1 (not `localhost`) because extra_hosts above remaps
      # `localhost` to the docker host -- see the comment there.
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://127.0.0.1:3000/api/auth/session"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  # Product image bytes. Named so they survive a `docker compose down` and
  # only a `down -v` discards them -- losing every product photograph on an
  # ordinary restart would make the stack unusable for development.
  oriah-s3-data:
  postgres-catalog-data:
  postgres-inventory-data:
  postgres-customer-data:
  postgres-cart-data:
  postgres-payment-data:
  postgres-order-data:
  postgres-promotion-data:
  postgres-notification-data:
  postgres-review-data:
  postgres-search-data:
  postgres-procurement-data:
  postgres-shipping-data:
  postgres-finance-data:
  postgres-keycloak-data:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  alloy-data:

networks:
  oriah:
    driver: bridge
