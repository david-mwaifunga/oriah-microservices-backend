spring:
  application:
    name: inventory
  config:
    # Pull additional config from the Config Server; optional so tests
    # and offline dev still work when the server is down.
    import: "optional:configserver:http://localhost:8888"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuer. Same as catalog. Tests override.
          issuer-uri: http://localhost:7080/realms/oriah

server:
  # Different port from catalog so both can run on the same host during dev.
  port: 8082
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring.cloud:
  function:
    # Tell Spring Cloud Stream which @Bean is the consumer to wire.
    # The bean 'productEvents' becomes binding 'productEvents-in-0'. With more
    # than one function every one must be listed, or it is not bound:
    # consignmentEvents reads procurement's live topic and consignmentReplay
    # the topic procurement answers inventory's catch-up on (Phase 5).
    definition: productEvents;consignmentEvents;consignmentReplay
  stream:
    bindings:
      productEvents-in-0:
        destination: catalog.product
        # All inventory instances share one consumer group so each message
        # lands at exactly one instance — same horizontal-scaling pattern
        # we'd want in prod.
        group: inventory
        consumer:
          # Inventory deserializes the payload manually (header-dispatched
          # to one of three event types) so we tell SCS to leave the
          # bytes alone.
          use-native-decoding: false
          # A snapshot inventory cannot apply throws (it is never
          # swallowed). catalog.product is read through the Inbox
          # (oriah.events.inbox.topics below), so the oriah-events module,
          # not the Kafka binder, decides what happens next: Kafka delivers
          # the event again, pausing 1 s and then doubling the pause, at most
          # 10 s. max-attempts counts deliveries IN ALL, so 3 here is three
          # deliveries, 1 s and then 2 s apart. Each one is a fresh poll of
          # the same event from Kafka, not a loop inside one poll ...
          max-attempts: 3
          back-off-initial-interval: 1000
          back-off-multiplier: 2.0
          back-off-max-interval: 10000
          # ... except a refusal, which fails the same way every time: a
          # type, payload version, aggregate-type or envelope header the
          # Inbox does not accept, or a snapshot that breaks the contract
          # (all IllegalArgumentException), and a body Jackson cannot read
          # (JsonProcessingException, found inside the UncheckedIOException
          # the consumer wraps it in). Retrying those cannot change the
          # answer and only holds up the products behind them, so they go
          # to the dead-letter topic on their first delivery. (Plain keys,
          # not "[...]": Spring Cloud Stream's defaults lookup rejects a
          # bracketed key with capitals and the app won't start.)
          retryable-exceptions:
            java.lang.IllegalArgumentException: false
            com.fasterxml.jackson.core.JsonProcessingException: false
      # Procurement's receipts: one consignment.received per consignment line.
      # They become cost lots. Read live from oriah.procurement, in a group of
      # its own and from the earliest message Kafka still has; everything older
      # comes through consignmentReplay below.
      consignmentEvents-in-0:
        destination: oriah.procurement
        group: inventory
        consumer:
          use-native-decoding: false
          max-attempts: 3
          back-off-initial-interval: 1000
          back-off-multiplier: 2.0
          back-off-max-interval: 10000
          # A refusal fails the same way every time and retrying cannot change
          # it: an event that breaks a promise it makes (IllegalArgumentException),
          # a body Jackson cannot read, or stock that disagrees with its lots
          # (IllegalStateException). They go to the dead-letter topic on their
          # first delivery. A lost race on the stock row is not listed, so it is
          # delivered again and applies.
          retryable-exceptions:
            java.lang.IllegalArgumentException: false
            java.lang.IllegalStateException: false
            com.fasterxml.jackson.core.JsonProcessingException: false
      # The answer to the replay inventory asked procurement for at start (the
      # catch-up in oriah.events.inbox below): its whole history, once.
      consignmentReplay-in-0:
        destination: oriah.replay.inventory
        group: inventory
        consumer:
          use-native-decoding: false
          max-attempts: 3
          back-off-initial-interval: 1000
          back-off-multiplier: 2.0
          back-off-max-interval: 10000
          retryable-exceptions:
            java.lang.IllegalArgumentException: false
            java.lang.IllegalStateException: false
            com.fasterxml.jackson.core.JsonProcessingException: false
    kafka:
      default:
        producer:
          # Inventory SENDS once, at start: the replay request to procurement.
          # A send must return only once Kafka has the record, or the request
          # would look sent when it never was and nothing would ever answer it:
          # the catch-up refuses to start without it.
          sync: true
      binder:
        # Overridden by application-docker.yaml inside the compose network.
        brokers: localhost:9092
        # How long one send may wait for Kafka (the replay request). Kept short
        # so a stopped broker fails the start quickly and loudly rather than
        # holding it for a minute or two; the module checks they fit.
        producer-properties:
          max.block.ms: 10000
          request.timeout.ms: 5000
          delivery.timeout.ms: 10000
      bindings:
        productEvents-in-0:
          consumer:
            # Then the module publishes it to a dead-letter topic of its own,
            # named <topic>.dlq.<group>, and only once that topic has it
            # commits the event and moves on to the products behind it. If
            # the publish fails (the topic is missing, the broker refuses
            # it), the event is NOT committed: the module logs one ERROR,
            # waits back-off-max-interval (10 s) and Kafka delivers it again,
            # until the dead-letter topic takes it. Nothing is dropped while
            # Kafka keeps it, but the products behind it wait meanwhile: an
            # ERROR every 10 to 35 s and the consumer group's growing lag are
            # how that shows. The dead-letter topic gets it at least once: a
            # crash between the publish and the commit publishes it again.
            # Nothing was recorded for it, so it could still be applied
            # later -- but today nothing does that: nothing reads
            # catalog.product.dlq.inventory and inventory has no replay
            # listener, so product_index stays as it was until catalog's next
            # snapshot of that product.
            # The module refuses to start unless this binding keeps a group,
            # enable-dlq with a dlq-name other than its own topic,
            # max-attempts of 2 or more and the default raw-bytes
            # deserializers: without them it could not dead-letter safely.
            enable-dlq: true
            dlq-name: catalog.product.dlq.inventory
            configuration:
              # Kafka takes the partition away if the next poll is more than
              # max.poll.interval.ms (5 min) away, and the events in hand
              # then come back to be failed all over again -- for ever, with
              # every product behind them waiting. Each retry is a new poll,
              # so a poll holds one try of each event it hands over and then
              # the wait before the next poll: a pause of 1 or 2 s, or after
              # the last try the dead-letter publish (up to about 25 s) and,
              # if that fails, the 10 s pause. One event per poll keeps the
              # worst poll (the database away: one try of up to 30 s, then
              # 25 + 10 s) at about 65 s, well inside it, and commits each
              # event's offset as it is done. ProductEventBindingTest adds it
              # up.
              max.poll.records: 1
        consignmentEvents-in-0:
          consumer:
            startOffset: earliest
            enable-dlq: true
            dlq-name: oriah.procurement.dlq.inventory
            configuration:
              # One receipt per poll, as for products: a poll then holds one
              # try of one event, well inside max.poll.interval.ms.
              max.poll.records: 1
        consignmentReplay-in-0:
          consumer:
            enable-dlq: true
            dlq-name: oriah.replay.inventory.dlq.inventory
            configuration:
              max.poll.records: 1

# The event log convention (shared/oriah-events). The Inbox records each event
# inventory applies (processed_event) and the newest seq per aggregate
# (processed_aggregate) in the same transaction as its effect, so a redelivered
# event never applies twice: not a product snapshot, and not a receipt (which
# would double both the stock and its cost).
#
# Inventory PUBLISHES nothing (Phase 5): the stock ledger is append-only and
# complete, so a later phase (6, 7 or 10) that needs inventory's events can
# publish them from it, losslessly, once the consumer and its contract exist.
# So outbox, relay and replay stay off here. It does ASK for a replay, below.
oriah.events.inbox.enabled: true
# The topics inventory reads through the Inbox. The module dead-letters their
# bindings itself (productEvents-in-0 and consignmentEvents-in-0) and never
# commits an event until its dead-letter topic has it; a binding on any other
# topic would keep the Kafka binder's own handling, which drops an event whose
# dead-letter publish fails. So the service refuses to start if a topic listed
# here is read by no input binding (a typo) or by more than one.
oriah.events.inbox.topics: catalog.product,oriah.procurement
# Inventory started after procurement had been receiving consignments, and
# Kafka keeps messages only for a while, so on its first start it asks
# procurement to send its whole history again, to oriah.replay.inventory
# (consignmentReplay-in-0). Each receipt becomes lots exactly once, whichever
# stream brings it first; outbox_catch_up (V9) remembers how far the replay got.
oriah.events.inbox.catch-up.consumer: inventory
oriah.events.inbox.catch-up.producers: procurement

# ---------------------------------------------------------------------------
# Local fallback for GET /api/v1/inventory/contact-info.
#
# config-repo/inventory.yaml overrides every key below whenever the Config Server
# is up: spring.config.import wins over the document that imports it. This
# block exists so the endpoint -- and, more importantly, the @Validated
# binding -- still work when it is down, which the local/Maven profile
# explicitly tolerates via `optional:configserver`.
#
# Without it, @NotBlank/@NotEmpty on InventoryContactInfoDto turn an absent prefix
# into BindValidationException and this service refuses to start. That is the
# Tier 4 `base-config` hard-link mistake exactly: centralizing a value
# converted an optional dependency into a required one.
#
# The keys here mirror config-repo/inventory.yaml ONE FOR ONE on purpose. Maps
# merge key by key across property sources while lists are replaced wholesale,
# so an extra key here would survive a config-repo override that omits it and
# leak a stale value into the served response.
# ---------------------------------------------------------------------------
oriah:
  inventory:
    contact-info:
      message: "Inventory service contact details are unavailable - the Config Server could not be reached"
      contact-details:
        name: unavailable
        email: unavailable
      on-call-support:
        - unavailable
