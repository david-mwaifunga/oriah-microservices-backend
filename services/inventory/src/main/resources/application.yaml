spring:
  application:
    name: inventory
  config:
    # Pull additional config from the Config Server; optional so tests
    # and offline dev still work when the server is down.
    import: "optional:configserver:http://localhost:8888"

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuer. Same as catalog. Tests override.
          issuer-uri: http://localhost:7080/realms/oriah

server:
  # Different port from catalog so both can run on the same host during dev.
  port: 8082
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

spring.cloud:
  function:
    # Tell Spring Cloud Stream which @Bean is the consumer to wire.
    # The bean 'productEvents' becomes binding 'productEvents-in-0'.
    definition: productEvents
  stream:
    bindings:
      productEvents-in-0:
        destination: catalog.product
        # All inventory instances share one consumer group so each message
        # lands at exactly one instance — same horizontal-scaling pattern
        # we'd want in prod.
        group: inventory
        consumer:
          # Inventory deserializes the payload manually (header-dispatched
          # to one of three event types) so we tell SCS to leave the
          # bytes alone.
          use-native-decoding: false
          # A snapshot inventory cannot apply throws (it is never
          # swallowed): the binder tries it again, pausing 1 s and then
          # doubling the pause, at most 10 s. Spring Cloud Stream 5.0 hands
          # max-attempts to Spring's RetryPolicy as the number of RETRIES
          # after the first try, so 3 here is up to four tries in all
          # (pauses of 1, 2 and 4 s) ...
          max-attempts: 3
          back-off-initial-interval: 1000
          back-off-multiplier: 2.0
          back-off-max-interval: 10000
          # ... except a refusal, which fails the same way every time: a
          # type, payload version or envelope header the Inbox does not
          # accept, or a snapshot that breaks the contract (all
          # IllegalArgumentException), and a body Jackson cannot read
          # (JsonProcessingException, found inside the UncheckedIOException
          # the consumer wraps it in). Retrying those cannot change the
          # answer and only holds up the products behind them, so they go
          # to the dead-letter topic on the first try. (Plain keys, not
          # "[...]": Spring Cloud Stream's defaults lookup rejects a
          # bracketed key with capitals and the app won't start.)
          retryable-exceptions:
            java.lang.IllegalArgumentException: false
            com.fasterxml.jackson.core.JsonProcessingException: false
    kafka:
      binder:
        # Overridden by application-docker.yaml inside the compose network.
        brokers: localhost:9092
      bindings:
        productEvents-in-0:
          consumer:
            # Then the binder publishes it to a dead-letter topic of its own,
            # named <topic>.dlq.<group>, and moves on to the products behind
            # it. Nothing was recorded for it, so it could still be applied
            # later -- but today nothing does that: nothing reads
            # catalog.product.dlq.inventory and inventory has no replay
            # listener, so product_index stays as it was until catalog's next
            # snapshot of that product. And the publish is best effort: if
            # the dead-letter topic does not take it, the binder only logs an
            # error and the offset is committed.
            enable-dlq: true
            dlq-name: catalog.product.dlq.inventory
            configuration:
              # The binder retries in the thread that polls Kafka. Kafka takes
              # the partition away if the next poll is more than
              # max.poll.interval.ms (5 min) away, and the batch in hand then
              # comes back to be failed all over again -- for ever, with every
              # product behind it waiting. One event per poll keeps the worst
              # poll (the database away: four tries of up to 30 s each, 7 s of
              # pauses, up to 122 s waiting on the dead-letter send) inside
              # it, and commits each event's offset as it is done.
              # ProductEventBindingTest adds it up.
              max.poll.records: 1

# The event log convention (shared/oriah-events). Inventory only receives here:
# the Inbox records each product event it applies (processed_event) and the
# newest seq per product (processed_aggregate) in the same transaction as the
# change to product_index, so a redelivered or older snapshot never overwrites
# a newer one. Inventory publishes nothing yet (stock movements join the event
# log in Phase 5), so outbox, relay and replay stay off.
oriah.events.inbox.enabled: true

# ---------------------------------------------------------------------------
# Local fallback for GET /api/v1/inventory/contact-info.
#
# config-repo/inventory.yaml overrides every key below whenever the Config Server
# is up: spring.config.import wins over the document that imports it. This
# block exists so the endpoint -- and, more importantly, the @Validated
# binding -- still work when it is down, which the local/Maven profile
# explicitly tolerates via `optional:configserver`.
#
# Without it, @NotBlank/@NotEmpty on InventoryContactInfoDto turn an absent prefix
# into BindValidationException and this service refuses to start. That is the
# Tier 4 `base-config` hard-link mistake exactly: centralizing a value
# converted an optional dependency into a required one.
#
# The keys here mirror config-repo/inventory.yaml ONE FOR ONE on purpose. Maps
# merge key by key across property sources while lists are replaced wholesale,
# so an extra key here would survive a config-repo override that omits it and
# leak a stale value into the served response.
# ---------------------------------------------------------------------------
oriah:
  inventory:
    contact-info:
      message: "Inventory service contact details are unavailable - the Config Server could not be reached"
      contact-details:
        name: unavailable
        email: unavailable
      on-call-support:
        - unavailable
