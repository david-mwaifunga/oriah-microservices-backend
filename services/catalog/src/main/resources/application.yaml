spring:
  application:
    # Tells the Config Server which file to serve us (catalog.yaml).
    name: catalog
  config:
    # Pull additional config from the Config Server at startup.
    # 'optional:' prefix means catalog still boots if the Config Server
    # is unreachable — keeps tests and offline dev unblocked. In a real
    # production deploy we'd drop 'optional:' so a missing Config Server
    # is a fail-fast condition.
    import: "optional:configserver:http://localhost:8888"

  # Datasource is left unset on purpose:
  # - In tests, the @ServiceConnection PostgreSQLContainer in TestcontainersConfiguration
  #   supplies url/username/password automatically.
  # - For local dev (running via TestCatalogServiceApplication.main),
  #   the same Testcontainer is reused.
  # - In production, datasource properties are supplied externally (env vars,
  #   Spring Cloud Config, or Kubernetes secrets).
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # Port stays local — different services need different ports on the
  # same host during dev, and the Config Server can't help here because
  # the port is needed before the Config Client has a chance to fetch.
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        # NOTE: the actual exposure list is overridden by config/application.yaml
        # on the Config Server when it's reachable. This local default keeps
        # /actuator/health up even in offline mode.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

# springdoc.* and logging.level.com.oriah.catalog moved to the Config
# Server (see infra/configserver/src/main/resources/config/catalog.yaml).
# When the server is reachable, those settings override these local
# defaults. When it's not, catalog still works — it just uses the
# Spring Boot defaults for those keys.
