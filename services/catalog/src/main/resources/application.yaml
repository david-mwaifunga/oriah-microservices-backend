spring:
  application:
    # Tells the Config Server which file to serve us (catalog.yaml).
    name: catalog
  config:
    # Pull additional config from the Config Server at startup.
    # 'optional:' prefix means catalog still boots if the Config Server
    # is unreachable — keeps tests and offline dev unblocked. In a real
    # production deploy we'd drop 'optional:' so a missing Config Server
    # is a fail-fast condition.
    import: "optional:configserver:http://localhost:8888"

  # -------------------------------------------------------------------------
  # Multipart limits for product image uploads.
  #
  # max-file-size matches ProductImageIngest.MAX_BYTES exactly. The two are
  # separate limits doing different jobs and both are needed: Spring rejects an
  # oversized part before the bytes are buffered at all, while the ingest check
  # catches a file arriving under this limit by some other route. If they ever
  # disagree, the looser one wins and the tighter becomes decoration.
  #
  # max-request-size is deliberately a little larger, to leave room for the
  # multipart envelope and accompanying form fields. Setting them equal makes a
  # file at exactly the limit fail with a confusing request-size error instead
  # of the file-size one.
  #
  # A THIRD limit sits at the edge: the gateway's RequestSize filter on
  # /api/v1/admin/products/**. That one exists because an oversized body
  # streaming through the reactive gateway is what exhausts its direct buffers,
  # and the gateway image bakes -XX:MaxDirectMemorySize=128m for exactly that
  # reason.
  #
  # Nested here rather than appended as a second top-level `spring:` block,
  # which is what the first attempt did -- a duplicate top-level key that
  # Spring Boot's YAML loader rejects, and that a more permissive loader would
  # resolve by keeping only the last occurrence, silently discarding the
  # datasource, JPA and Flyway settings below.
  # -------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # Datasource is left unset on purpose:
  # - In tests, the @ServiceConnection PostgreSQLContainer in TestcontainersConfiguration
  #   supplies url/username/password automatically.
  # - For local dev (running via TestCatalogServiceApplication.main),
  #   the same Testcontainer is reused.
  # - In production, datasource properties are supplied externally (env vars,
  #   Spring Cloud Config, or Kubernetes secrets).
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    openfeign:
      circuitbreaker:
        # Wrap every Feign call with a Resilience4j circuit breaker.
        # When the circuit is open or the call fails, Feign delegates to
        # the bean named in the @FeignClient(fallback = ...) attribute.
        enabled: true
    stream:
      # No binding for catalog.product: the outbox relay (shared/oriah-events)
      # sends each outbox row to the topic named on the row, which is how a
      # dynamic destination works in Spring Cloud Stream. These defaults
      # therefore apply to it, and to every profile and every test.
      default:
        contentType: application/json
      kafka:
        default:
          producer:
            # A send returns only once Kafka has the record. Without it the
            # binder answers "sent" as soon as the record is queued inside
            # the service, the relay would move its cursor past an event Kafka
            # never took, and that event would never be published. The relay
            # refuses to start without it, in tests too.
            sync: true
        binder:
          # Overridden in application-docker.yaml to the in-network broker.
          # Left as a localhost default so a developer running catalog
          # outside docker (mvnw spring-boot:run) hits a local Kafka if
          # they're testing the publish path manually.
          brokers: localhost:9092
          # How long one send may wait for Kafka. While a send waits, the
          # relay's round holds its transaction and its place in the log;
          # with Kafka's own defaults a stopped broker would hold it for 60 to
          # 120 seconds. With these the send fails in about 10 to 25, the
          # cursor stays put, and the row goes out in a later round.
          #
          # They also limit how long one replay step can take. A step sends up
          # to 10 rows and then one continuation or end-of-replay marker, one
          # after another, and each send can wait max.block.ms and then
          # delivery.timeout.ms before it fails. The event-log module refuses
          # to start catalog unless that fits inside the 5 minutes Kafka
          # allows the replay listener between two polls:
          # (10 + 1) x (10 s + 10 s) = 220 s. Raise them past that and catalog
          # will not start. StartupChecksPerProfileTest checks it in every
          # profile.
          producer-properties:
            max.block.ms: 10000         # waiting for the topic's details from the broker
            request.timeout.ms: 5000    # one request to the broker
            delivery.timeout.ms: 10000  # the whole send, retries included
        # Nothing here for the replay-request listener (outboxReplayRequests-in-0)
        # on purpose. The event-log module binds it and sets all of its Kafka
        # settings itself: a request that keeps failing is delivered 3 times
        # in all and then parked on oriah.outbox.replay-requests.dlq.catalog
        # (never dropped, even when parking it fails at first), and the
        # listener reads one request per poll. Its values win over anything
        # written here, because the way a replay is answered depends on them,
        # so a copy here would decide nothing. ReplayRequestBindingTest pins
        # what the listener gets.

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuer. Spring Security fetches the JWKS
          # endpoint via OIDC discovery (<issuer>/.well-known/
          # openid-configuration). For local dev, run Keycloak on port
          # 7080; see docs/ARCHITECTURE.md "Keycloak setup."
          # Tests override this via @TestPropertySource so they don't
          # need a live Keycloak.
          issuer-uri: http://localhost:7080/realms/oriah

server:
  # Port stays local — different services need different ports on the
  # same host during dev, and the Config Server can't help here because
  # the port is needed before the Config Client has a chance to fetch.
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        # NOTE: the actual exposure list is overridden by config/application.yaml
        # on the Config Server when it's reachable. This local default keeps
        # /actuator/health up even in offline mode.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

# springdoc.* and logging.level.com.oriah.catalog moved to the Config
# Server (see infra/configserver/src/main/resources/config/catalog.yaml).
# When the server is reachable, those settings override these local
# defaults. When it's not, catalog still works — it just uses the
# Spring Boot defaults for those keys.

eureka:
  client:
    # Where to register and where to look up other services.
    # Clients default to http://localhost:8761/eureka/ when this is
    # absent, but keep it explicit so the dependency is obvious in
    # logs and ops dashboards.
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # Register by IP rather than hostname so the gateway and other
    # services can reach this instance reliably on a developer laptop
    # (avoids "Could not resolve hostname 'maya-laptop.local'" surprises).
    prefer-ip-address: true

# Resilience4j for the catalog -> inventory call.
#
# Shared values come from config-repo/application.yaml
# (resilience4j.circuitbreaker.configs.default); only the instance name and the
# one genuine difference are here.
#
# NOTE on timelimiter, which is the interesting part. It dispatches the call to
# another thread, and that is exactly what broke JWT propagation in checkout
# (SecurityContextHolder is a ThreadLocal; on a pool worker it is empty, the
# Authorization header is dropped, and the downstream 401s). It is safe HERE
# only because this one call is unauthenticated: catalog forwards no token, and
# inventory permits GET /api/v1/inventory/** without one.
#
# That invariant is load-bearing and was previously undocumented. If inventory's
# read ever requires a token, or catalog ever gains a RequestInterceptor that
# forwards one, this timelimiter and
# spring.cloud.openfeign.circuitbreaker.enabled: true must both go -- otherwise
# every product page silently loses its availability badge, degrading to the
# fallback rather than failing visibly. FeignCircuitBreakerSafetyTest guards it.
resilience4j:
  circuitbreaker:
    # configs.default held locally, not in config-repo: a base-config reference
    # is a hard link, and this service imports config with
    # `optional:configserver`, so resolving it remotely would prevent startup
    # whenever the Config Server is down. Proven by
    # checkout's ResilienceConfigResolutionTest.
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
    instances:
      inventory:
        base-config: default
        # Three trial calls in HALF_OPEN rather than the default: availability
        # enrichment is called on every product view, so a single unlucky probe
        # should not reopen the circuit for everyone.
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      inventory:
        # Availability enrichment is decoration on a product page; if inventory
        # cannot answer in 2s the page is better off rendering without it.
        timeout-duration: 2s

# ---------------------------------------------------------------------------
# Local fallback for GET /api/v1/products/contact-info.
#
# config-repo/catalog.yaml overrides every key below whenever the Config Server
# is up: spring.config.import wins over the document that imports it. This
# block exists so the endpoint -- and, more importantly, the @Validated
# binding -- still work when it is down, which the local/Maven profile
# explicitly tolerates via `optional:configserver`.
#
# Without it, @NotBlank/@NotEmpty on CatalogContactInfoDto turn an absent prefix
# into BindValidationException and this service refuses to start. That is the
# Tier 4 `base-config` hard-link mistake exactly: centralizing a value
# converted an optional dependency into a required one.
#
# The keys here mirror config-repo/catalog.yaml ONE FOR ONE on purpose. Maps
# merge key by key across property sources while lists are replaced wholesale,
# so an extra key here would survive a config-repo override that omits it and
# leak a stale value into the served response.
# ---------------------------------------------------------------------------
oriah:
  # -------------------------------------------------------------------------
  # The event log (shared/oriah-events, MVP_PLAN Phase 1).
  #
  # Every product and price change is appended to catalog's outbox table in
  # the transaction that makes it; the relay publishes the outbox to Kafka in
  # the order it was written; and a consumer that joins late can ask for the
  # whole log again (replay). Catalog consumes no events, so the Inbox stays
  # off -- answered replay requests are recorded in processed_event without it.
  # Each switch is exactly true or false; anything else stops the service.
  # -------------------------------------------------------------------------
  events:
    producer: catalog                 # sent with every message as the `producer` header
    topics: catalog.product           # an append to any other topic is refused
    outbox:
      enabled: true
    relay:
      enabled: true
    replay:
      enabled: true
    inbox:
      enabled: false
  catalog:
    contact-info:
      message: "Catalog service contact details are unavailable - the Config Server could not be reached"
      contact-details:
        name: unavailable
        email: unavailable
      on-call-support:
        - unavailable
    storage:
      bucket: oriah-catalog
      region: us-east-1

# ---------------------------------------------------------------------------
# Object storage for product images.
#
# NO endpoint here on purpose. Absent means the in-memory implementation, which
# is what makes `mvnw spring-boot:test-run` and the test suite work without a
# container. application-docker.yaml supplies the real endpoint, following the
# same split as the datasource URL: in-container hostnames live in the docker
# profile, never in the base file.
#
# Credentials are supplied by the environment rather than written here. They
# belong to an account scoped to this one bucket -- not the storage admin --
# which was verified against the server: the scoped key receives 403 when it
# attempts to create a bucket, so a compromise of this service cannot create or
# replace storage locations.
# ---------------------------------------------------------------------------
