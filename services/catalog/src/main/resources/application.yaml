spring:
  application:
    # Tells the Config Server which file to serve us (catalog.yaml).
    name: catalog
  config:
    # Pull additional config from the Config Server at startup.
    # 'optional:' prefix means catalog still boots if the Config Server
    # is unreachable — keeps tests and offline dev unblocked. In a real
    # production deploy we'd drop 'optional:' so a missing Config Server
    # is a fail-fast condition.
    import: "optional:configserver:http://localhost:8888"

  # Datasource is left unset on purpose:
  # - In tests, the @ServiceConnection PostgreSQLContainer in TestcontainersConfiguration
  #   supplies url/username/password automatically.
  # - For local dev (running via TestCatalogServiceApplication.main),
  #   the same Testcontainer is reused.
  # - In production, datasource properties are supplied externally (env vars,
  #   Spring Cloud Config, or Kubernetes secrets).
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    openfeign:
      circuitbreaker:
        # Wrap every Feign call with a Resilience4j circuit breaker.
        # When the circuit is open or the call fails, Feign delegates to
        # the bean named in the @FeignClient(fallback = ...) attribute.
        enabled: true
    stream:
      # Spring Cloud Stream functional model: we publish via
      # StreamBridge.send("productEvents-out-0", message). The binding name
      # 'productEvents-out-0' maps to the topic below; '-out-0' is the SCS
      # convention for "first output channel of binding productEvents".
      bindings:
        productEvents-out-0:
          destination: catalog.product
      kafka:
        binder:
          # Overridden in application-docker.yaml to the in-network broker.
          # Left as a localhost default so a developer running catalog
          # outside docker (mvnw spring-boot:run) hits a local Kafka if
          # they're testing the publish path manually.
          brokers: localhost:9092

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuer. Spring Security fetches the JWKS
          # endpoint via OIDC discovery (<issuer>/.well-known/
          # openid-configuration). For local dev, run Keycloak on port
          # 7080; see docs/ARCHITECTURE.md "Keycloak setup."
          # Tests override this via @TestPropertySource so they don't
          # need a live Keycloak.
          issuer-uri: http://localhost:7080/realms/oriah

server:
  # Port stays local — different services need different ports on the
  # same host during dev, and the Config Server can't help here because
  # the port is needed before the Config Client has a chance to fetch.
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        # NOTE: the actual exposure list is overridden by config/application.yaml
        # on the Config Server when it's reachable. This local default keeps
        # /actuator/health up even in offline mode.
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

# springdoc.* and logging.level.com.oriah.catalog moved to the Config
# Server (see infra/configserver/src/main/resources/config/catalog.yaml).
# When the server is reachable, those settings override these local
# defaults. When it's not, catalog still works — it just uses the
# Spring Boot defaults for those keys.

eureka:
  client:
    # Where to register and where to look up other services.
    # Clients default to http://localhost:8761/eureka/ when this is
    # absent, but keep it explicit so the dependency is obvious in
    # logs and ops dashboards.
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # Register by IP rather than hostname so the gateway and other
    # services can reach this instance reliably on a developer laptop
    # (avoids "Could not resolve hostname 'maya-laptop.local'" surprises).
    prefer-ip-address: true

# Resilience4j for the catalog -> inventory call.
#
# Shared values come from config-repo/application.yaml
# (resilience4j.circuitbreaker.configs.default); only the instance name and the
# one genuine difference are here.
#
# NOTE on timelimiter, which is the interesting part. It dispatches the call to
# another thread, and that is exactly what broke JWT propagation in checkout
# (SecurityContextHolder is a ThreadLocal; on a pool worker it is empty, the
# Authorization header is dropped, and the downstream 401s). It is safe HERE
# only because this one call is unauthenticated: catalog forwards no token, and
# inventory permits GET /api/v1/inventory/** without one.
#
# That invariant is load-bearing and was previously undocumented. If inventory's
# read ever requires a token, or catalog ever gains a RequestInterceptor that
# forwards one, this timelimiter and
# spring.cloud.openfeign.circuitbreaker.enabled: true must both go -- otherwise
# every product page silently loses its availability badge, degrading to the
# fallback rather than failing visibly. FeignCircuitBreakerSafetyTest guards it.
resilience4j:
  circuitbreaker:
    # configs.default held locally, not in config-repo: a base-config reference
    # is a hard link, and this service imports config with
    # `optional:configserver`, so resolving it remotely would prevent startup
    # whenever the Config Server is down. Proven by
    # checkout's ResilienceConfigResolutionTest.
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
    instances:
      inventory:
        base-config: default
        # Three trial calls in HALF_OPEN rather than the default: availability
        # enrichment is called on every product view, so a single unlucky probe
        # should not reopen the circuit for everyone.
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      inventory:
        # Availability enrichment is decoration on a product page; if inventory
        # cannot answer in 2s the page is better off rendering without it.
        timeout-duration: 2s

# ---------------------------------------------------------------------------
# Local fallback for GET /api/v1/products/contact-info.
#
# config-repo/catalog.yaml overrides every key below whenever the Config Server
# is up: spring.config.import wins over the document that imports it. This
# block exists so the endpoint -- and, more importantly, the @Validated
# binding -- still work when it is down, which the local/Maven profile
# explicitly tolerates via `optional:configserver`.
#
# Without it, @NotBlank/@NotEmpty on CatalogContactInfoDto turn an absent prefix
# into BindValidationException and this service refuses to start. That is the
# Tier 4 `base-config` hard-link mistake exactly: centralizing a value
# converted an optional dependency into a required one.
#
# The keys here mirror config-repo/catalog.yaml ONE FOR ONE on purpose. Maps
# merge key by key across property sources while lists are replaced wholesale,
# so an extra key here would survive a config-repo override that omits it and
# leak a stale value into the served response.
# ---------------------------------------------------------------------------
oriah:
  catalog:
    contact-info:
      message: "Catalog service contact details are unavailable - the Config Server could not be reached"
      contact-details:
        name: unavailable
        email: unavailable
      on-call-support:
        - unavailable
