spring:
  application:
    name: checkout
  config:
    import: "optional:configserver:http://localhost:8888"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/oriah
  cloud:
    openfeign:
      circuitbreaker:
        # Disabled: even with `group.enabled: false`, Spring Cloud's
        # OpenFeign+Resilience4j integration dispatches Feign calls to a
        # ForkJoinPool worker. SecurityContextHolder is ThreadLocal, so
        # the JWT-forwarding RequestInterceptor sees an empty context on
        # the worker thread, the Authorization header is omitted, and the
        # downstream resource server returns 401. With CB off, the call
        # stays on the Tomcat servlet thread where the SecurityContext is
        # populated; resilience comes from Feign's own readTimeout + the
        # fallbacks that fire on the synchronous exception path.
        enabled: false
      client:
        config:
          default:
            connectTimeout: 5000
            # 15s: first POST to order-service initializes the Kafka
            # producer (one-time ~2s overhead), and payment-service's
            # confirm runs the (fake) gateway synchronously. 15s leaves
            # generous margin for cold-start without making the orchestrator
            # appear stuck to the UI.
            readTimeout: 15000
            loggerLevel: basic

server:
  port: 8089

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.oriah.checkout: INFO

# Resilience4j toolbox per Feign client. Composed and invoked
# synchronously by com.oriah.checkout.resilience.ResilientFeignCaller
# (Decorators.ofSupplier(...).withRateLimiter(rl).withCircuitBreaker(cb)
# .withRetry(retry).decorate().get()) so the SecurityContextHolder
# ThreadLocal stays populated on the Tomcat thread -- see the
# spring.cloud.openfeign.circuitbreaker.enabled comment above for
# what Spring Cloud's OpenFeign+R4J integration does wrong (dispatches
# to a ForkJoinPool worker and loses the JWT).
#
# Why TimeLimiter and Bulkhead are NOT used: both dispatch the call
# to a separate thread (CompletableFuture / ForkJoinPool) and trigger
# the same SecurityContext loss. Latency is bounded by Feign's
# readTimeout (15s, declared above); concurrency by the Tomcat thread
# pool (max-threads: 200 default).
#
# One instance per Feign client (not per method): when a downstream
# is unhealthy, every call from this orchestrator to that client
# should trip the SAME circuit. Different methods don't have
# meaningfully different failure profiles for our domains.
resilience4j:
  circuitbreaker:
    instances:
      cart:      { sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s }
      inventory: { sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s }
      promotion: { sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s }
      shipping:  { sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s }
      payment:   { sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s }
      order:     { sliding-window-size: 10, failure-rate-threshold: 50, wait-duration-in-open-state: 30s }
  retry:
    instances:
      # 3 attempts total (1 initial + 2 retries), 500ms fixed wait
      # between attempts. Retry only on transport-layer faults
      # (IOException) and downstream 5xx (FeignException.FeignServerException);
      # do NOT retry on 4xx (FeignClientException) since a bad request
      # body or auth failure will not get better on retry.
      cart:      &retryCommon
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - java.io.IOException
          - feign.FeignException$FeignServerException
        ignore-exceptions:
          - feign.FeignException$FeignClientException
      inventory: *retryCommon
      promotion: *retryCommon
      shipping:  *retryCommon
      payment:   *retryCommon
      order:     *retryCommon
  ratelimiter:
    instances:
      # 50 calls per second per client, 100ms wait if the bucket is
      # empty before failing the call. Protects each downstream from
      # a runaway loop in this orchestrator (or a thundering-herd
      # retry storm) while leaving plenty of room for normal traffic.
      cart:      &ratelimiterCommon
        limit-for-period: 50
        limit-refresh-period: 1s
        timeout-duration: 100ms
      inventory: *ratelimiterCommon
      promotion: *ratelimiterCommon
      shipping:  *ratelimiterCommon
      payment:   *ratelimiterCommon
      order:     *ratelimiterCommon
