# Test-only settings, layered OVER src/main/resources/application.yaml.
#
# Spring Boot reads classpath:/config/application.yaml after
# classpath:/application.yaml, and a key here wins over the same key there;
# every other key still comes from the main file. Only the test classpath has
# this file, so the service as shipped never sees it.
#
# The settlement watcher's schedule is off in tests. A test context stays alive for the whole run once it has started, and a pass landing
# mid-test would announce again the very confirmations a test is counting. Tests call SettlementWatcher.reemitDue(now) themselves;
# WatcherScheduleTest switches the schedule back on to prove it. Set here and not in each test's @TestPropertySource so that every test keeps
# the same properties and therefore the same cached Spring context.
oriah:
  payment:
    watcher:
      enabled: false
    # The checker that asks ZynlePay about payments (Phase 13) is off in tests too, for the same reason: tests call ProviderPaymentChecks.poll(now)
    # themselves; ProviderPollScheduleTest switches the schedule back on to prove it.
    zynlepay:
      poll:
        enabled: false
