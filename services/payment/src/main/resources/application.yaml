spring:
  application:
    name: payment
  config:
    import: "optional:configserver:http://localhost:8888"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  task:
    scheduling:
      # Three scheduled jobs run here, each on a thread of its own: the outbox
      # relay (shared/oriah-events), the payment reconciler (card path) and, since
      # Phase 7, the settlement watcher that announces confirmed money again while
      # order has not answered. Spring Boot's default is ONE thread for all of
      # them, so a reconciler or watcher pass waiting on a slow database or gateway
      # would hold back every payment announcement, and a relay round waiting on a
      # stopped Kafka (up to about 25 s) would hold back both.
      # ReconcilerScheduleTest and WatcherScheduleTest prove it. Add a thread for
      # any further @Scheduled job.
      pool:
        size: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/oriah
  cloud:
    # Nested under the EXISTING spring.cloud key on purpose: a second
    # top-level `spring:` key is refused by Spring Boot's loader.
    openfeign:
      circuitbreaker:
        # Stays off. OrderClient sends the caller's own token, read from
        # SecurityContextHolder, which belongs to the request thread; Spring
        # Cloud's circuit-breaker integration runs the call on another thread,
        # so the token would be dropped and order would answer 401 to every
        # ownership check. Order and checkout document the same trap.
        enabled: false
      client:
        config:
          # Creating an intent (the card path, off unless
          # oriah.payment.card.enabled) asks order whose order it is
          # (OrderOwnership). Feign's own defaults here would give order 10 s
          # to connect and 60 s to answer, which would hold payment, and
          # whoever waits on payment, for a minute. With these, a hanging
          # order costs payment at most 1 s + 3 s = 4 s, and payment answers
          # 503 with Retry-After (OrderUnavailableException) rather than wait.
          #
          # Nothing calls payment's create today: Phase 7 removed the call
          # from checkout, which now places an order and leaves the payment to
          # staff. When ZynlePay (Phase 13) gives the card path a caller, that
          # caller's wait must leave room for these 4 s plus payment's own
          # write (one short database transaction); restate the budget then,
          # and make CreateIntentBudgetTest read the caller's configuration.
          #
          # The read is one order by id, so 3 s is generous.
          #
          # Keyed by the client's NAME (@FeignClient(name = "order")): Spring
          # Cloud silently uses the defaults for a name it has no config for,
          # so a misspelled key looks exactly like an omitted one -- the test
          # asserts the name as well.
          order:
            connect-timeout: 1000
            read-timeout: 3000
    # With more than one function every one must be listed, or it is not bound. The replayer's own listener (outboxReplayRequests) is added by
    # the event-log module while replay is on.
    function:
      definition: orderEvents
    stream:
      # Only the event log uses Kafka here (shared/oriah-events/README.md):
      # the outbox relay publishes payment.succeeded / payment.failed and, since Phase 7, the staff-money events (payment.confirmed, .rejected,
      # .voided, .held) to oriah.payment, the replayer reads replay requests from
      # oriah.outbox.replay-requests and answers them, and the Inbox reads order's events from oriah.order. These are set here, not
      # per profile, so every profile and every test runs with them -- the
      # relay refuses to start without sync=true, and the replayer without
      # the send timeouts below.
      default:
        contentType: application/json
      bindings:
        # Order's events (Phase 7): a shopper's claim, the sale being paid by a confirmation, and money that could not pay the sale. Read live from
        # oriah.order in a group of its own, from the earliest message Kafka still has (each is applied once: the Inbox and the effects see to it).
        orderEvents-in-0:
          destination: oriah.order
          group: payment
          consumer:
            use-native-decoding: false
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 10000
            # A refusal fails the same way every time (an event type nobody declared, a method that is cash, an id that is not an id, a body Jackson
            # cannot read): straight to the dead-letter topic on the first delivery. A database that is away is not listed, so it is delivered again.
            retryable-exceptions:
              java.lang.IllegalArgumentException: false
              java.lang.IllegalStateException: false
              com.fasterxml.jackson.core.JsonProcessingException: false
      kafka:
        default:
          producer:
            # A send returns only once Kafka has the record. Without it the
            # relay would move its cursor past an event Kafka never took, and
            # a payment that happened would never be announced.
            sync: true
        binder:
          brokers: localhost:9092
          # How long one send may wait for Kafka. While it waits the relay
          # holds its database transaction and its place in the log; with
          # Kafka's own defaults a stopped broker holds it for 60 to 120
          # seconds, with these the send fails in about 10 to 25 and the row
          # goes out in a later round.
          #
          # They also limit how long one replay step can take. A step sends up
          # to 10 rows and then one continuation or end-of-replay marker, one
          # after another, and each send can wait max.block.ms and then
          # delivery.timeout.ms before it fails. The event-log module refuses
          # to start payment unless that fits inside the 5 minutes Kafka
          # allows the replay listener between two polls:
          # (10 + 1) x (10 s + 10 s) = 220 s, and the module adds what a
          # failing step also spends (25 s for its dead-letter publish, 10 s
          # for the pause after a failed one): 255 s, under 300 s. If the two
          # timeouts together ever reach about 24 s (11 x 24 s + 35 s = 299 s),
          # payment will not start. StartupChecksPerProfileTest checks it in
          # every profile.
          producer-properties:
            "[max.block.ms]": 10000
            "[request.timeout.ms]": 5000
            "[delivery.timeout.ms]": 10000
        bindings:
          orderEvents-in-0:
            consumer:
              startOffset: earliest
              enable-dlq: true
              dlq-name: oriah.order.dlq.payment
              configuration:
                # One event per poll: a poll then holds one try of one event, well inside max.poll.interval.ms (5 min), even with the database away.
                max.poll.records: 1
        # Nothing here for the replay-request listener (outboxReplayRequests-in-0)
        # on purpose. The event-log module binds it and sets all of its Kafka
        # settings itself: a request that keeps failing is delivered 3 times
        # in all and then parked on oriah.outbox.replay-requests.dlq.payment
        # (never dropped, even when parking it fails at first), and the
        # listener reads one request per poll. Its values win over anything
        # written here, because the way a replay is answered depends on them,
        # so a copy here would decide nothing. ReplayRequestBindingTest pins
        # what the listener gets.

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ---------------------------------------------------------------------------
# The event log (MVP_PLAN Phase 1, shared/oriah-events/README.md).
#
# Payment is a producer: each charge outcome is appended to its outbox in the
# same transaction that records it (outbox), published to Kafka in order
# (relay), and sent again to a late consumer that asks (replay) -- in steps of
# up to 10 rows (oriah.events.replay.chunk-size, left at the module's
# default), so no single step can outlast the time Kafka allows it. It
# consumes nothing yet, so the Inbox stays off; each replay step is still
# answered once, its id recorded in processed_event, without it. Each switch
# is exactly true or false.
# ---------------------------------------------------------------------------
oriah:
  events:
    producer: payment
    topics: oriah.payment
    outbox:
      enabled: true
    relay:
      enabled: true
    replay:
      enabled: true
    # Phase 7: payment reads order's events through the Inbox (a claim, the sale paid, money that could not pay it). The module dead-letters the
    # binding itself and refuses to start if a topic listed here is read by no input binding or by more than one.
    inbox:
      enabled: true
      topics: oriah.order

  # Phase 12: money that goes back to customers.
  refunds:
    # The most a provider's charge for sending money back can be: a larger figure is a typing mistake (400 invalid-send-charge).
    max-send-charge: 500.00
    bearer:
      # Who bears the provider's charge when HELD money is paid back, by why it was held. (For a refund the order system decides, from why
      # the sale was corrected, and says so on the debt.) A missing line refuses to start: this is never guessed.
      held:
        # The customer sent the wrong amount, paid twice, or paid for an order already cancelled: the customer bears it.
        WRONG_AMOUNT: CUSTOMER
        ALREADY_PAID: CUSTOMER
        ORDER_CANCELLED: CUSTOMER
        # The piece was sold while the money was on its way, or staff keyed it against an order nobody knows: the delay was Oriah's.
        PIECE_SOLD: ORIAH
        ORDER_UNKNOWN: ORIAH

  payment:
    # -------------------------------------------------------------------------
    # The card path (Phase 7): the intent endpoints (/api/v1/payments/intents), the service behind them, the fake card gateway, the
    # reconciler below and the Feign client to order. OFF: money reaches an order only by a person confirming it (staff confirmations,
    # /api/v1/admin/payments/confirmations), so there is no second road to PAID. Phase 13 turns it on when ZynlePay makes a card charge a
    # confirmation. Exactly true or false; the tests run with it on (src/test/resources/config/application.yaml).
    # -------------------------------------------------------------------------
    card:
      enabled: false

    # -------------------------------------------------------------------------
    # Staff-confirmed money (Phase 7).
    #
    # currency: the one currency the shop takes. A confirmation names it or takes it; any other is refused.
    # -------------------------------------------------------------------------
    currency: ZMW

    # -------------------------------------------------------------------------
    # The settlement watcher (SettlementWatcher): announces a confirmation AGAIN while order has not said what became of its money (it paid the
    # sale, or could not), so a lost message is recovered and nothing recorded is left unacted on. Order treats a repeat as a repeat.
    #
    # delay: milliseconds between the end of one pass and the start of the next.
    # max-emit-attempts: announcements in all (the first, when it is recorded, counts). Past it the confirmation stays in the pending list for a
    #   person, and is logged as an error when it reaches the limit. How long a confirmation waits before it is announced again is
    #   oriah.sales.settlement-stuck-after below, then twice as long each time, up to an hour.
    #
    # On in every profile. (The tests switch it off and call it themselves; see src/test/resources/config/application.yaml.)
    # -------------------------------------------------------------------------
    watcher:
      enabled: true
      delay: 30000
      max-emit-attempts: 10

    # -------------------------------------------------------------------------
    # The reconciler (PaymentReconciler): settles intents whose charge outcome
    # never reached payment -- a gateway timeout, a crash, or a failure to
    # record the answer -- by asking the gateway about the charge reference.
    #
    # charging-age: how long an intent must have been CHARGING before it is
    #   asked about. A confirm still waiting on the gateway is CHARGING too,
    #   and asking too early would void a charge that was about to go through,
    #   so this must stay well above the longest gateway call.
    # delay: milliseconds between the end of one pass and the start of the
    #   next.
    #
    # On in every profile: without it a lost answer stays CHARGING for good.
    # (The tests switch it off and call it themselves; see
    # src/test/resources/config/application.yaml.)
    # -------------------------------------------------------------------------
    reconciler:
      enabled: true
      charging-age: 120s
      delay: 30000

    # ---------------------------------------------------------------------------
    # Local fallback for GET /api/v1/payments/contact-info.
    #
    # config-repo/payment.yaml overrides every key below whenever the Config Server
    # is up: spring.config.import wins over the document that imports it. This
    # block exists so the endpoint -- and, more importantly, the @Validated
    # binding -- still work when it is down, which the local/Maven profile
    # explicitly tolerates via `optional:configserver`.
    #
    # Without it, @NotBlank/@NotEmpty on PaymentContactInfoDto turn an absent prefix
    # into BindValidationException and this service refuses to start. That is the
    # Tier 4 `base-config` hard-link mistake exactly: centralizing a value
    # converted an optional dependency into a required one.
    #
    # The keys here mirror config-repo/payment.yaml ONE FOR ONE on purpose. Maps
    # merge key by key across property sources while lists are replaced wholesale,
    # so an extra key here would survive a config-repo override that omits it and
    # leak a stale value into the served response.
    # ---------------------------------------------------------------------------
    contact-info:
      message: "Payment service contact details are unavailable - the Config Server could not be reached"
      contact-details:
        name: unavailable
        email: unavailable
      on-call-support:
        - unavailable

  # The sale as a whole (Phase 7): shared with order, read here for the one thing payment watches.
  sales:
    # How long confirmed money may wait for order's answer (it paid the sale, or could not) before it is called STUCK: flagged in the pending list,
    # announced again by the watcher, and counted by the payment.confirmations.stuck gauge.
    settlement-stuck-after: PT5M
    # How far back anyone who may confirm may date money (the day it arrived); older needs BACKDATE_SALE and a reason. The ONE 72-hour setting: order reads the
    # same key for the date of a recorded sale and of a dispatch step.
    backdate-window: PT72H
