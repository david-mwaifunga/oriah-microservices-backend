spring:
  application:
    name: order
  config:
    import: "optional:configserver:http://localhost:8888"
  task:
    scheduling:
      # Four scheduled jobs run here, each on a thread of its own: the outbox relay (shared/oriah-events) and, since Phase 7, the hold job that
      # finishes what a request left half done (a payment claim whose hold was not yet stretched, a placement inventory never answered) and the
      # settlement job that asks inventory again for confirmed money whose sale could not be applied yet; since Phase 12 the correction job, which
      # asks inventory again for a paid cancellation or a return it has not settled.
      # Spring Boot's default is ONE thread for all of them, so a relay round waiting on a stopped Kafka (up to about 25 s) would hold the
      # jobs back, and a job pass waiting on a slow inventory would hold the relay back. Add a thread for any further @Scheduled job.
      pool:
        size: 4
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/oriah
      # Order's own identity, for calls it makes on the shop's behalf rather
      # than the shopper's: a client-credentials token for
      # service-account-oriah-admin, sent to shipping to price delivery
      # (MVP_PLAN Phase 0, item 4.2). Only ShippingClient uses it
      # (ShippingClientIdentity); payment and customer keep the shopper's token.
      #
      # token-uri, never issuer-uri: an issuer triggers discovery at start-up,
      # which fails offline and inside the container. The secret is never
      # committed for production: it comes from ORIAH_SERVICE_CLIENT_SECRET,
      # with the development value only in application-local.yaml and the
      # development compose file.
      client:
        registration:
          oriah-admin:
            provider: keycloak
            client-id: oriah-admin
            client-secret: ${ORIAH_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
        provider:
          keycloak:
            token-uri: http://localhost:7080/realms/oriah/protocol/openid-connect/token
  cloud:
    # Nested under the EXISTING spring.cloud key on purpose. A second
    # top-level `spring:` document key is rejected by Spring Boot's loader,
    # and a permissive loader would resolve it by discarding one of the two.
    openfeign:
      circuitbreaker:
        # Stays off. CustomerClient forwards the shopper's JWT from
        # SecurityContextHolder, which is a ThreadLocal, and Spring Cloud's
        # OpenFeign+Resilience4j integration dispatches the call to a
        # ForkJoinPool worker -- the Authorization header would be dropped and
        # customer would answer 401 for every address check. It also keeps a
        # failed call throwing rather than falling back to an invented answer
        # (a price, a delivery cost, whether the pieces are held). Checkout
        # documents the same trap.
        enabled: false
      client:
        config:
          # catalog is called SYNCHRONOUSLY on the write path, inside a request
          # checkout makes and cuts off at 15s (checkout's application.yaml,
          # its default readTimeout). feign-core's library defaults are 10s
          # connect / 60s read, so an unconfigured client can hang for four
          # times checkout's whole budget -- and the only symptom checkout can
          # report is a downstream outage for a catalog that is merely slow.
          #
          # A placement makes FOUR calls, one after another, and then saves the
          # order. All of it has to fit inside checkout's 15s. In order:
          #
          #   customer  0.5s + 2s   is this address the caller's?
          #   catalog   1s   + 3s   what do the lines cost?
          #   token     1s   + 3s   order's own token, when the cached one has
          #                         run out (set in MachineIdentityConfig)
          #   shipping  0.5s + 2s   what does the chosen delivery cost?
          #   ----------------------
          #   13s worst case for the calls -- every call taking its full time
          #   to connect and its full time to answer -- which leaves 2s of
          #   checkout's 15s for order's own work: one transaction (the order,
          #   its lines, its event-log row) and the reply. That is normally
          #   tens of milliseconds; 2s covers a slow commit or a
          #   garbage-collection pause. Without that room checkout could give
          #   up first, in the very worst case, and order save an order nobody
          #   is waiting for -- left CREATED and unpaid. WritePathBudgetTest
          #   adds the calls up (the token's from MachineIdentityConfig's own
          #   constants) and fails unless they leave those 2s. A further call
          #   on this path must take its time from these, not add to them.
          #
          # Where those 2s came from (the four calls used to take exactly
          # 15s): shipping's answer went from 3s to 2s, and customer's and
          # shipping's connect from 1s to 0.5s.
          #   - Shipping works out a price from settings it holds in memory --
          #     no database, no call of its own -- so warm, it answers in
          #     milliseconds. It keeps 2s, not 1s, for the cold case: an order
          #     placed straight to order (the smoke test's step 4b, Postman)
          #     can be the first request on a fresh stack that shipping checks
          #     a token for, and it then fetches Keycloak's signing keys and
          #     runs its code for the first time.
          #   - A connection to a service on the same network opens in a
          #     millisecond or two, so half a second to connect costs nothing
          #     while the network is healthy; when it is not, giving up sooner
          #     is better anyway.
          #   - Customer and catalog each read a database, and Keycloak signs a
          #     token, so their answers kept their time. (Catalog's and the
          #     token's connect could give 0.5s each too -- room for shipping's
          #     old 3s -- but CatalogClientTimeoutTest pins catalog's 1s and the
          #     token's is set in MachineIdentityConfig.)
          #
          # Every value is read under the client's NAME (CatalogClientTimeoutTest
          # explains why that is asserted): Spring Cloud builds a context per
          # name and silently falls back to the defaults for a name it has no
          # config for, so a misspelled key here looks exactly like an omitted
          # one.
          #
          # customer gets 2s to answer: on the checkout path checkout has just
          # read this same list, so customer is warm, and the answer is a few
          # rows for one shopper. OutboundIdentityTest.aHangingCustomerTimesOut
          # shows a hanging customer is given up on in time;
          # WritePathBudgetTest.customerHasItsOwnTimeouts pins the numbers.
          customer:
            connect-timeout: 500
            read-timeout: 2000
          # catalog was 2s/5s while it shared the path with only the token and
          # shipping; adding customer would have made 18s, so it now has 1s/3s,
          # like the token, which is still ample for one batch of at most 100
          # ids -- and checkout priced the same bag from catalog moments
          # earlier, so catalog is warm too. CatalogClientTimeoutTest pins it.
          catalog:
            connect-timeout: 1000
            read-timeout: 3000
          # The staff price read of a recorded sale (Phase 9): asked once per sale on the request thread with the person's token, never on the shopper's
          # placement path (so it does not count in WritePathBudgetTest). One batch of at most 100 ids and a promotion lookup behind it: 0.5s to connect, 4s to answer.
          catalogAsOf:
            connect-timeout: 500
            read-timeout: 4000
          # Making a returned piece a listing of its own (Phase 12): asked once per assessment on the request thread with the person's token, never on
          # the shopper's placement path (so it does not count in WritePathBudgetTest). One product saved: 0.5s to connect, 4s to answer.
          catalogMarkdown:
            connect-timeout: 500
            read-timeout: 4000
          # 0.5s to connect, 2s to answer: see "Where those 2s came from"
          # above. WritePathBudgetTest.shippingHasItsOwnTimeouts pins the
          # numbers; OutboundIdentityTest.aHangingShippingTimesOut shows a
          # hanging shipping is given up on in time.
          shipping:
            connect-timeout: 500
            read-timeout: 2000
          # inventory holds the pieces while the shopper pays (Phase 7): the FIFTH call on the placement path, after shipping. 0.5s to
          # connect, 2s to answer: one transaction that locks the stock rows of one bag (at most a hundred lines) and writes the hold.
          # Its 2.5s is what raised checkout's wait for order from 15s to 20s: the placement path is now 15.5s at worst (customer 2.5,
          # catalog 4, token 4, shipping 2.5, inventory 2.5) and the card tail that used to fill checkout's wait is gone.
          # WritePathBudgetTest adds them up against checkout's own file and pins these numbers.
          inventory:
            connect-timeout: 500
            read-timeout: 2000
    # With more than one function every one must be listed, or it is not bound. The replayer's own listener (outboxReplayRequests) is added by the
    # event-log module while replay is on.
    function:
      definition: paymentEvents;inventoryEvents
    stream:
      # No producer binding: order no longer sends to Kafka itself. Every event
      # is a row in the outbox, and the relay (shared/oriah-events) sends each
      # row to the topic stored on it, oriah.order.
      #
      # Every send is JSON, including the relay's to oriah.order and the
      # replays' to oriah.replay.<consumer>, which are named only at send time.
      default:
        contentType: application/json
      bindings:
        # Payment's events (Phase 7): money staff confirmed, money they voided, a claim they rejected. Read live from oriah.payment in a group of its
        # own, from the earliest message Kafka still has (each is applied once: the Inbox and the effects see to it).
        paymentEvents-in-0:
          destination: oriah.payment
          group: order
          consumer:
            use-native-decoding: false
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 10000
            # A refusal fails the same way every time (an event type nobody declared, a body that cannot be read, an id that is not an id): straight to
            # the dead-letter topic on the first delivery. A database that is away is not listed, so it is delivered again.
            retryable-exceptions:
              java.lang.IllegalArgumentException: false
              java.lang.IllegalStateException: false
              tools.jackson.core.JacksonException: false
        # Inventory's events (Phase 7): a hold lapsed. Read live from oriah.inventory the same way.
        inventoryEvents-in-0:
          destination: oriah.inventory
          group: order
          consumer:
            use-native-decoding: false
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 10000
            retryable-exceptions:
              java.lang.IllegalArgumentException: false
              java.lang.IllegalStateException: false
              tools.jackson.core.JacksonException: false
      kafka:
        default:
          producer:
            # A send returns only once Kafka has the record, and fails if Kafka
            # did not take it. The relay moves its cursor past a row only on a
            # send that returned, so without this it could pass a row Kafka
            # never got and that event would never be published. The relay
            # refuses to start without it -- in tests too.
            sync: true
        binder:
          brokers: localhost:9092
          # How long one send may wait for a broker that is down. The relay
          # holds its database transaction and its place in the log while it
          # waits; Kafka's defaults would hold them for a minute or two. With
          # these a send fails within about 10 to 25 s, the cursor stays where
          # it was, and the row goes out once the broker is back.
          #
          # They also limit how long one replay step can take. A step sends up
          # to 10 rows and then one continuation or end-of-replay marker, one
          # after another, and each send can wait max.block.ms and then
          # delivery.timeout.ms before it fails. The event-log module refuses
          # to start order unless that fits inside the 5 minutes Kafka
          # allows the replay listener between two polls:
          # (10 + 1) x (10 s + 10 s) = 220 s, plus 35 s for what a failing
          # step also spends (its dead-letter publish and the pause after a
          # failed one) = 255 s, under 300 s. Raise them past about 24 s
          # together and order will not start. StartupChecksPerProfileTest checks it in
          # every profile.
          producer-properties:
            max.block.ms: 10000         # waiting for the topic's details from the broker
            request.timeout.ms: 5000    # one request to the broker
            delivery.timeout.ms: 10000  # the whole send, retries included
        bindings:
          paymentEvents-in-0:
            consumer:
              startOffset: earliest
              enable-dlq: true
              dlq-name: oriah.payment.dlq.order
              configuration:
                # One event per poll: a poll then holds one try of one event, well inside max.poll.interval.ms (5 min), even with the database away.
                max.poll.records: 1
          inventoryEvents-in-0:
            consumer:
              startOffset: earliest
              enable-dlq: true
              dlq-name: oriah.inventory.dlq.order
              configuration:
                max.poll.records: 1
        # Nothing here for the replay-request listener (outboxReplayRequests-in-0)
        # on purpose. The event-log module binds it and sets all of its Kafka
        # settings itself: a request that keeps failing is delivered 3 times
        # in all and then parked on oriah.outbox.replay-requests.dlq.order
        # (never dropped, even when parking it fails at first), and the
        # listener reads one request per poll. Its values win over anything
        # written here, because the way a replay is answered depends on them,
        # so a copy here would decide nothing. ReplayRequestBindingTest pins
        # what the listener gets.

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

oriah:
  # The event log (shared/oriah-events, MVP_PLAN Phase 1). Every order change
  # is appended to the outbox in the same transaction as the change; the relay
  # publishes the outbox to oriah.order; replay answers a late consumer that
  # asks for the whole log again. Since Phase 7 order CONSUMES events too -- it owns the sale, so it hears
  # what became of the money (oriah.payment) and of the hold (oriah.inventory) -- and its Inbox is on:
  # each event is applied once. Each switch is exactly true or false: the module refuses anything else.
  events:
    outbox:
      enabled: true
    relay:
      enabled: true
    replay:
      enabled: true
    # The module refuses to start unless every topic listed here is read by exactly one input binding, with a dead-letter topic named
    # <topic>.dlq.<group> (paymentEvents-in-0 and inventoryEvents-in-0 above).
    inbox:
      enabled: true
      topics: oriah.payment,oriah.inventory
    # Sent with every message as the producer header.
    producer: order
    # The only topic order may publish to: an append naming any other is refused.
    topics: oriah.order

  # -------------------------------------------------------------------------
  # The sale (Phase 7): a placement HOLDS the pieces at inventory while the shopper pays. Every value has a default in code; config-repo may
  # override. The tests switch the hold job off (src/test/resources/config/application.yaml) and call it themselves.
  #
  # max-live-orders / max-held-pieces: what one shopper may hold at once (owner question Q12): a hold is stock nobody else can buy and costs the
  #     shopper nothing, so it is bounded. Past either, a placement is 409 hold-limit-reached.
  # payment-submitted-hold: the longest a hold is stretched to once a payment reference is submitted (inventory caps it again from when the hold was
  #     made). The first hold is inventory's own default (ten minutes).
  # pending-grace: how long an order written PENDING may wait for inventory's answer before the hold job gives its hold back and deletes it.
  # hold-job: every pass finishes pending hold extensions and gives back stale placements; delay is milliseconds between the end of one pass and the
  #     start of the next. On in every profile.
  # -------------------------------------------------------------------------
  # settlement-job: asks inventory again, every 15 s, for confirmed money whose sale could not be applied yet (inventory silent, a hold that lapsed
  #     meanwhile, only a box missing); the wait between tries doubles from 15 s up to five minutes.
  # settlement-stuck-after: how long confirmed money may wait to pay its sale before it is called STUCK (an ERROR in the log; staff see it in their queue).
  sales:
    max-live-orders: 3
    max-held-pieces: 20
    payment-submitted-hold: PT24H
    # A payment through ZynlePay (Phase 13): how long the pieces are held once the order has taken the attempt (long enough for the customer to
    # approve it and for ZynlePay to answer; payment hands an unanswered attempt to the owner after 30 minutes), and the least time a hold must
    # have left for an attempt to be taken at all.
    provider-payment-hold: PT45M
    provider-payment-min-hold-left: PT2M
    pending-grace: PT1M
    settlement-stuck-after: PT5M
    hold-job:
      enabled: true
      delay: 15000
    settlement-job:
      enabled: true
      delay: 15000
    # Phase 12 (returns and refunds). correction-job: asks inventory again, every 15 s, for a paid cancellation or a return whose stock answer was never
    #     heard, and for a returned piece whose outcome inventory has not recorded yet; the wait between tries doubles from 15 s up to five minutes.
    # correction-stuck-after: how long a correction may wait on inventory before it is called STUCK (an ERROR in the log; staff see it in their list).
    # return-duplicate-window: a second return of the same pieces of one order inside this window must be confirmed by the person (a double click).
    correction-job:
      enabled: true
      delay: 15000
    correction-stuck-after: PT5M
    return-duplicate-window: PT10M

  # -------------------------------------------------------------------------
  # Refunds (Phase 12). Who bears the charge for sending a refund back, per reason: CUSTOMER (the charge is taken from the refund: the client's rule,
  # CLIENT_DECISIONS) or ORIAH. Every reason must be set: a missing one refuses to start. The answer is written on the correction when it is recorded,
  # so changing a setting never changes a debt already recorded. Typing K0.00 at the payout is how the owner waives the charge on one case.
  # -------------------------------------------------------------------------
  refunds:
    bearer:
      cancellation:
        CUSTOMER_ASKED: CUSTOMER
        PIECE_UNAVAILABLE: CUSTOMER
        SHOP_ERROR: CUSTOMER
        OTHER: CUSTOMER
      return:
        CHANGED_MIND: CUSTOMER
        WRONG_SIZE: CUSTOMER
        FAULTY: CUSTOMER
        NOT_AS_DESCRIBED: CUSTOMER
        WRONG_ITEM_SENT: CUSTOMER
        DAMAGED_IN_TRANSIT: CUSTOMER
        NOT_DELIVERED: CUSTOMER
        OTHER: CUSTOMER

  # -------------------------------------------------------------------------
  # Local fallback for GET /api/v1/orders/contact-info.
  #
  # config-repo/order.yaml overrides every key below whenever the Config Server
  # is up: spring.config.import wins over the document that imports it. This
  # block exists so the endpoint -- and, more importantly, the @Validated
  # binding -- still work when it is down, which the local/Maven profile
  # explicitly tolerates via `optional:configserver`.
  #
  # Without it, @NotBlank/@NotEmpty on OrderContactInfoDto turn an absent prefix
  # into BindValidationException and this service refuses to start. That is the
  # Tier 4 `base-config` hard-link mistake exactly: centralizing a value
  # converted an optional dependency into a required one.
  #
  # The keys here mirror config-repo/order.yaml ONE FOR ONE on purpose. Maps
  # merge key by key across property sources while lists are replaced wholesale,
  # so an extra key here would survive a config-repo override that omits it and
  # leak a stale value into the served response.
  # -------------------------------------------------------------------------
  order:
    contact-info:
      message: "Order service contact details are unavailable - the Config Server could not be reached"
      contact-details:
        name: unavailable
        email: unavailable
      on-call-support:
        - unavailable
