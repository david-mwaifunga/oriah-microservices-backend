spring:
  application:
    name: order
  config:
    import: "optional:configserver:http://localhost:8888"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/oriah
      # Order's own identity, for calls it makes on the shop's behalf rather
      # than the shopper's: a client-credentials token for
      # service-account-oriah-admin, sent to shipping to price delivery
      # (MVP_PLAN Phase 0, item 4.2). Only ShippingClient uses it
      # (ShippingClientIdentity); payment and customer keep the shopper's token.
      #
      # token-uri, never issuer-uri: an issuer triggers discovery at start-up,
      # which fails offline and inside the container. The secret is never
      # committed for production: it comes from ORIAH_SERVICE_CLIENT_SECRET,
      # with the development value only in application-local.yaml and the
      # development compose file.
      client:
        registration:
          oriah-admin:
            provider: keycloak
            client-id: oriah-admin
            client-secret: ${ORIAH_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
        provider:
          keycloak:
            token-uri: http://localhost:7080/realms/oriah/protocol/openid-connect/token
  cloud:
    # Nested under the EXISTING spring.cloud key on purpose. A second
    # top-level `spring:` document key is rejected by Spring Boot's loader,
    # and a permissive loader would resolve it by discarding one of the two.
    openfeign:
      circuitbreaker:
        # Stays off. PaymentClient and CustomerClient forward the shopper's JWT
        # from SecurityContextHolder, which is a ThreadLocal, and Spring Cloud's
        # OpenFeign+Resilience4j integration dispatches the call to a
        # ForkJoinPool worker -- the Authorization header would be dropped and
        # payment would answer 401 for every verification, customer for every
        # address check. It also keeps a
        # failed call throwing rather than falling back to an invented answer
        # about whether an order was paid. Checkout documents the same trap.
        enabled: false
      client:
        config:
          # catalog is called SYNCHRONOUSLY on the write path, inside a request
          # checkout makes and cuts off at 15s (checkout application.yaml:44).
          # feign-core's library defaults are 10s connect / 60s read, so an
          # unconfigured client can hang for four times checkout's whole
          # budget -- and the only symptom checkout can report is a downstream
          # outage for a catalog that is merely slow.
          #
          # A placement makes FOUR calls, one after another, and all of them
          # have to fit inside checkout's 15s together. In order:
          #
          #   customer  1s + 2s   is this address the caller's?
          #   catalog   1s + 3s   what do the lines cost?
          #   token     1s + 3s   order's own token, when the cached one has
          #                       run out (set in MachineIdentityConfig)
          #   shipping  1s + 3s   what does the chosen delivery cost?
          #   --------------------
          #   15s worst case -- every call taking its full time to connect
          #   and its full time to answer. That is ALL of checkout's 15s:
          #   there is no slack, so a further call on this path must take its
          #   time from these, not add to them. Past 15s checkout gives up
          #   while order is still working, and order may yet save an order
          #   nobody is waiting for. WritePathBudgetTest adds these up (the
          #   token's from MachineIdentityConfig's own constants) and fails
          #   when they no longer fit. Not counted: the save and the event
          #   publish after these calls, so in the very worst case -- all four
          #   at their full timeouts -- checkout can still give up first. That
          #   was already so before customer was added.
          #
          # Every value is read under the client's NAME (CatalogClientTimeoutTest
          # explains why that is asserted): Spring Cloud builds a context per
          # name and silently falls back to the defaults for a name it has no
          # config for, so a misspelled key here looks exactly like an omitted
          # one.
          #
          # customer gets 2s to answer: on the checkout path checkout has just
          # read this same list, so customer is warm, and the answer is a few
          # rows for one shopper. OutboundIdentityTest.aHangingCustomerTimesOut
          # pins it.
          customer:
            connect-timeout: 1000
            read-timeout: 2000
          # catalog was 2s/5s while it shared the path with only the token and
          # shipping; adding customer would have made 18s, so it now has 1s/3s like
          # shipping and the token, which is still ample for one batch of at
          # most 100 ids -- and checkout priced the same bag from catalog
          # moments earlier, so catalog is warm too.
          catalog:
            connect-timeout: 1000
            read-timeout: 3000
          # OutboundIdentityTest.aHangingShippingTimesOut pins this one.
          shipping:
            connect-timeout: 1000
            read-timeout: 3000
    stream:
      bindings:
        orderEvents-out-0:
          destination: oriah.order
      kafka:
        binder:
          brokers: localhost:9092

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ---------------------------------------------------------------------------
# Local fallback for GET /api/v1/orders/contact-info.
#
# config-repo/order.yaml overrides every key below whenever the Config Server
# is up: spring.config.import wins over the document that imports it. This
# block exists so the endpoint -- and, more importantly, the @Validated
# binding -- still work when it is down, which the local/Maven profile
# explicitly tolerates via `optional:configserver`.
#
# Without it, @NotBlank/@NotEmpty on OrderContactInfoDto turn an absent prefix
# into BindValidationException and this service refuses to start. That is the
# Tier 4 `base-config` hard-link mistake exactly: centralizing a value
# converted an optional dependency into a required one.
#
# The keys here mirror config-repo/order.yaml ONE FOR ONE on purpose. Maps
# merge key by key across property sources while lists are replaced wholesale,
# so an extra key here would survive a config-repo override that omits it and
# leak a stale value into the served response.
# ---------------------------------------------------------------------------
oriah:
  order:
    contact-info:
      message: "Order service contact details are unavailable - the Config Server could not be reached"
      contact-details:
        name: unavailable
        email: unavailable
      on-call-support:
        - unavailable
