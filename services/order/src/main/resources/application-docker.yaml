spring:
  datasource:
    url: jdbc:postgresql://postgres-order:5432/orders
    username: ${SPRING_DATASOURCE_USERNAME:orders}
    password: ${SPRING_DATASOURCE_PASSWORD:orders}
  config:
    import: "configserver:http://configserver:8888"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/oriah
          jwk-set-uri: http://keycloak:8080/realms/oriah/protocol/openid-connect/certs
      # Inside the network Keycloak is keycloak:8080. The token's iss stays
      # http://localhost:7080/... because Keycloak runs with KC_HOSTNAME set.
      client:
        provider:
          keycloak:
            token-uri: http://keycloak:8080/realms/oriah/protocol/openid-connect/token

spring.cloud.stream.kafka.binder.brokers: kafka:9092

eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8761/eureka/
