spring:
  application:
    name: shipping
  config:
    import: "optional:configserver:http://localhost:8888"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/oriah

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ---------------------------------------------------------------------------
# Local fallback for GET /api/v1/shipping/contact-info.
#
# config-repo/shipping.yaml overrides every key below whenever the Config
# Server is up: spring.config.import wins over the document that imports it
# (measured, not assumed). This block exists so the endpoint -- and, more
# importantly, the @Validated binding -- still work when it is down, which the
# local/Maven profile explicitly tolerates via `optional:configserver`.
#
# Without it, @NotBlank/@NotEmpty on ShippingContactInfoDto turn an absent
# prefix into BindValidationException and shipping refuses to start. That is
# the Tier 4 `base-config` hard-link mistake exactly: centralizing a value
# converted an optional dependency into a required one.
#
# The keys here mirror config-repo/shipping.yaml ONE FOR ONE on purpose. Maps
# merge key by key across property sources while lists are replaced wholesale,
# so an extra key here would survive a config-repo override that omits it and
# leak a stale value into the served response.
# ---------------------------------------------------------------------------
oriah:
  shipping:
    # -----------------------------------------------------------------------
    # The published rate card. These were compiled into ShippingService's
    # switch, next to the literal "USD" on every option: free over 150,
    # standard 5.00, express 12.00, and so on per zone.
    #
    # They are business tariffs rather than logic, and the brand's currency is
    # a configurable decision, so the card has to move with it.
    #
    # THE VALUES BELOW ARE THE OLD USD CARD MULTIPLIED BY 25, which is roughly
    # the Kwacha rate. That basis is written down so it is auditable and
    # reversible -- it is NOT a commercial decision, because real tariffs
    # depend on carrier contracts. Replace them here or in
    # config-repo/shipping.yaml.
    #
    # A complete card is kept locally on purpose: a service whose only source
    # for its money configuration is the Config Server refuses to start when
    # the Config Server is down, which is the mistake this project already
    # made once with contact-info below.
    # -----------------------------------------------------------------------
    tariff:
      currency: ZMW
      domestic:      { standard-cost: 125.00,  express-cost: 300.00,  free-over: 3750.00 }
      regional:      { standard-cost: 375.00,  express-cost: 875.00,  free-over: 6250.00 }
      international: { standard-cost: 1125.00, express-cost: 2125.00, free-over: 12500.00 }
    contact-info:
      message: "Shipping service contact details are unavailable - the Config Server could not be reached"
      contact-details:
        name: unavailable
        email: unavailable
      on-call-support:
        - unavailable
