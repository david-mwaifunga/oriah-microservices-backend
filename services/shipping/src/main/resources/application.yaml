spring:
  application:
    name: shipping
  config:
    import: "optional:configserver:http://localhost:8888"
  flyway:
    enabled: true
    locations: classpath:db/migration
  # A version and a count of days are WHOLE numbers. The platform's JSON reader would turn 1.9 into 1 before validation sees it, so a version
  # of 0.9 would pass as 0 and defeat the stale-copy check. With this off, a fraction where a whole number belongs is a 400.
  jackson:
    deserialization:
      accept-float-as-int: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/oriah

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ---------------------------------------------------------------------------
# Local fallback for GET /api/v1/shipping/contact-info.
#
# config-repo/shipping.yaml overrides every key below whenever the Config
# Server is up: spring.config.import wins over the document that imports it
# (measured, not assumed). This block exists so the endpoint -- and, more
# importantly, the @Validated binding -- still work when it is down, which the
# local/Maven profile explicitly tolerates via `optional:configserver`.
#
# Without it, @NotBlank/@NotEmpty on ShippingContactInfoDto turn an absent
# prefix into BindValidationException and shipping refuses to start. That is
# the Tier 4 `base-config` hard-link mistake exactly: centralizing a value
# converted an optional dependency into a required one.
#
# The keys here mirror config-repo/shipping.yaml ONE FOR ONE on purpose. Maps
# merge key by key across property sources while lists are replaced wholesale,
# so an extra key here would survive a config-repo override that omits it and
# leak a stale value into the served response.
# ---------------------------------------------------------------------------
oriah:
  shipping:
    # Delivery prices are data admin publishes per town (Phase 7), not
    # configuration: the zone rate card and its `tariff` key are gone.
    contact-info:
      message: "Shipping service contact details are unavailable - the Config Server could not be reached"
      contact-details:
        name: unavailable
        email: unavailable
      on-call-support:
        - unavailable
