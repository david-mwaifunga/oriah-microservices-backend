spring:
  application:
    name: search
  config:
    import: "optional:configserver:http://localhost:8888"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/oriah
  cloud:
    function:
      definition: productEvents
    stream:
      bindings:
        productEvents-in-0:
          destination: catalog.product
          group: search
          consumer:
            use-native-decoding: false
            # A snapshot the index cannot apply throws (it is never
            # swallowed). catalog.product is read through the Inbox
            # (oriah.events.inbox.topics below), so the oriah-events module,
            # not the Kafka binder, decides what happens next: Kafka delivers
            # the event again, pausing 1 s and then doubling the pause, at most
            # 10 s. max-attempts counts deliveries IN ALL, so 3 here is three
            # deliveries, 1 s and then 2 s apart. Each one is a fresh poll of
            # the same event from Kafka, not a loop inside one poll ...
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            back-off-max-interval: 10000
            # ... except a refusal, which fails the same way every time: a
            # type, payload version, aggregate-type or envelope header the
            # Inbox does not accept, or a snapshot that breaks the contract
            # (all IllegalArgumentException), and a body Jackson cannot read
            # (JsonProcessingException, found inside the
            # UncheckedIOException the consumer wraps it in). Retrying those
            # cannot change the answer and only holds up the products behind
            # them, so they go to the dead-letter topic on their first
            # delivery.
            # (Plain keys, not "[...]": Spring Cloud Stream's defaults lookup
            # rejects a bracketed key with capitals and the app won't start.)
            retryable-exceptions:
              java.lang.IllegalArgumentException: false
              com.fasterxml.jackson.core.JsonProcessingException: false
      kafka:
        binder:
          brokers: localhost:9092
        bindings:
          productEvents-in-0:
            consumer:
              # Then the module publishes it to a dead-letter topic of its
              # own, named <topic>.dlq.<group>, and only once that topic has
              # it commits the event and moves on to the products behind it.
              # If the publish fails (the topic is missing, the broker refuses
              # it), the event is NOT committed: the module logs one ERROR,
              # waits back-off-max-interval (10 s) and Kafka delivers it
              # again, until the dead-letter topic takes it. Nothing is
              # dropped while Kafka keeps it, but the products behind it wait
              # meanwhile: an ERROR every 10 to 35 s and the consumer group's
              # growing lag are how that shows. The dead-letter topic gets it
              # at least once: a crash between the publish and the commit
              # publishes it again.
              # Nothing was recorded for it, so it could still be applied
              # later -- but today nothing does that: nothing reads
              # catalog.product.dlq.search and search has no replay
              # listener, so the index stays as it was until catalog's next
              # snapshot of that product.
              # The module refuses to start unless this binding keeps a
              # group, enable-dlq with a dlq-name other than its own topic,
              # max-attempts of 2 or more and the default raw-bytes
              # deserializers: without them it could not dead-letter safely.
              enable-dlq: true
              dlq-name: catalog.product.dlq.search
              configuration:
                # Kafka takes the partition away if the next poll is more
                # than max.poll.interval.ms (5 min) away, and the events in
                # hand then come back to be failed all over again -- for ever,
                # with every product behind them waiting. Each retry is a new
                # poll, so a poll holds one try of each event it hands over
                # and then the wait before the next poll: a pause of 1 or 2 s,
                # or after the last try the dead-letter publish (up to about
                # 25 s) and, if that fails, the 10 s pause. One event per poll
                # keeps the worst poll (the database away: one try of up to
                # 30 s, then 25 + 10 s) at about 65 s, well inside it, and
                # commits each event's offset as it is done.
                # ProductEventBindingTest adds it up.
                max.poll.records: 1

# The event log convention (shared/oriah-events). Search only receives: the
# Inbox records each product event it applies (processed_event) and the newest
# seq per product (processed_aggregate) in the same transaction as the index
# change, so a redelivered or older snapshot never overwrites a newer one.
# Search publishes nothing, so outbox, relay and replay stay off.
oriah.events.inbox.enabled: true
# The topics search reads through the Inbox. The module dead-letters their
# bindings itself (here only productEvents-in-0) and never commits an event
# until its dead-letter topic has it; a binding on any other topic would keep
# the Kafka binder's own handling, which drops an event whose dead-letter
# publish fails. So the service refuses to start if a topic listed here is
# read by no input binding (a typo) or by more than one.
oriah.events.inbox.topics: catalog.product

server:
  port: 8092

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ---------------------------------------------------------------------------
# Local fallback for GET /api/v1/search/contact-info.
#
# config-repo/search.yaml overrides every key below whenever the Config Server
# is up: spring.config.import wins over the document that imports it. This
# block exists so the endpoint -- and, more importantly, the @Validated
# binding -- still work when it is down, which the local/Maven profile
# explicitly tolerates via `optional:configserver`.
#
# Without it, @NotBlank/@NotEmpty on SearchContactInfoDto turn an absent prefix
# into BindValidationException and this service refuses to start. That is the
# Tier 4 `base-config` hard-link mistake exactly: centralizing a value
# converted an optional dependency into a required one.
#
# The keys here mirror config-repo/search.yaml ONE FOR ONE on purpose. Maps
# merge key by key across property sources while lists are replaced wholesale,
# so an extra key here would survive a config-repo override that omits it and
# leak a stale value into the served response.
# ---------------------------------------------------------------------------
oriah:
  search:
    contact-info:
      message: "Search service contact details are unavailable - the Config Server could not be reached"
      contact-details:
        name: unavailable
        email: unavailable
      on-call-support:
        - unavailable
