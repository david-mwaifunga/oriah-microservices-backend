spring:
  application:
    name: cart
  config:
    import: "optional:configserver:http://localhost:8888"
  # Nested under the EXISTING spring key deliberately. A second top-level
  # `spring:` document key is rejected by Spring Boot's loader, and a
  # permissive loader would resolve the clash by discarding one of the two --
  # here, silently taking the datasource and JPA config with it.
  cloud:
    openfeign:
      circuitbreaker:
        # OFF, so Spring Cloud uses DefaultTargeter and a failed pricing call
        # THROWS. The alternative is a fallback, and there is no correct
        # default answer to "what does this variant cost": zero sells it for
        # nothing and the last known price is the stale snapshot this phase
        # exists to remove. Catalog is the counter-example in this repo -- it
        # enables the breaker, which is what makes its InventoryClientFallback
        # live and turns an unreachable inventory into Availability.UNKNOWN.
        # Reasonable for stock, unacceptable for price.
        # Pinned by CatalogPricingClientWiringTest.
        enabled: false
      client:
        config:
          default:
            # Deliberately tighter than checkout's 5s/15s. This call sits in
            # front of a shopper pressing "Add to bag", and a pricing lookup is
            # one indexed read: if catalog cannot answer in 5s, a prompt 503
            # that leaves the bag untouched is a better answer than a request
            # that hangs long enough for the shopper to press the button again.
            connectTimeout: 2000
            readTimeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/oriah

server:
  port: 8084
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ---------------------------------------------------------------------------
# Local fallback for GET /api/v1/carts/contact-info.
#
# config-repo/cart.yaml overrides every key below whenever the Config Server
# is up: spring.config.import wins over the document that imports it. This
# block exists so the endpoint -- and, more importantly, the @Validated
# binding -- still work when it is down, which the local/Maven profile
# explicitly tolerates via `optional:configserver`.
#
# Without it, @NotBlank/@NotEmpty on CartContactInfoDto turn an absent prefix
# into BindValidationException and this service refuses to start. That is the
# Tier 4 `base-config` hard-link mistake exactly: centralizing a value
# converted an optional dependency into a required one.
#
# The keys here mirror config-repo/cart.yaml ONE FOR ONE on purpose. Maps
# merge key by key across property sources while lists are replaced wholesale,
# so an extra key here would survive a config-repo override that omits it and
# leak a stale value into the served response.
# ---------------------------------------------------------------------------
oriah:
  cart:
    contact-info:
      message: "Cart service contact details are unavailable - the Config Server could not be reached"
      contact-details:
        name: unavailable
        email: unavailable
      on-call-support:
        - unavailable
