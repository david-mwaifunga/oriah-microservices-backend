spring:
  application:
    name: procurement
  config:
    import: "optional:configserver:http://localhost:8888"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Invoices are uploaded as multipart (DocumentController). The file limit is the same 5 MB the
  # service enforces itself (DocumentService.MAX_BYTES) and the database CHECK holds: Spring
  # refuses an oversized part before it is buffered, the service refuses one that arrives some
  # other way, and the CHECK is the last word. The request limit is a little larger to leave room
  # for the multipart envelope and the form fields; set equal, a file at exactly 5 MB would fail
  # with a confusing request-size error instead of being accepted.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # A count, a version and a weight in grams are WHOLE numbers. The platform's JSON reader turns
  # 1.9 into 1 before validation sees it, so an order for "1.9" rings was recorded as one and a
  # version of 0.9 passed as 0, defeating the stale-copy check. With this off, a fraction where a
  # whole number belongs is a 400 (WholeNumbersAndNamesHttpTest).
  jackson:
    deserialization:
      accept-float-as-int: false

  cloud:
    openfeign:
      circuitbreaker:
        # Stays off. The catalog client forwards the signed-in person's JWT from a
        # ThreadLocal, and Spring Cloud's Resilience4j integration runs the call on a
        # ForkJoinPool worker: the header would be dropped and catalog would answer 401
        # for every lookup. It also keeps a failed call THROWING rather than falling back
        # to an invented answer about whether a variant exists.
        enabled: false
      client:
        config:
          catalog:
            # One lookup per order placement or line change, on the request thread. The
            # library defaults (10 s to connect, 60 s to read) would let a slow catalog hold
            # a request, and a database connection with it, for a minute.
            connect-timeout: 1000
            read-timeout: 3000
    stream:
      # No binding for oriah.procurement: the outbox relay (shared/oriah-events)
      # sends each outbox row to the topic named on the row, which is how a
      # dynamic destination works in Spring Cloud Stream. These defaults
      # therefore apply to it, and to every profile and every test.
      default:
        contentType: application/json
      kafka:
        default:
          producer:
            # A send returns only once Kafka has the record. Without it the
            # binder answers "sent" as soon as the record is queued inside the
            # service, the relay would move its cursor past an event Kafka never
            # took, and that event would never be published. The relay refuses to
            # start without it, in tests too.
            sync: true
        binder:
          # Overridden in application-docker.yaml to the in-network broker. The
          # localhost default is the Kafka HOST listener, which is what a
          # developer running procurement from the IDE reaches.
          brokers: localhost:9092
          # How long one send may wait for Kafka. While a send waits, the relay's
          # round holds its transaction and its place in the log; with Kafka's own
          # defaults a stopped broker would hold it for 60 to 120 seconds.
          #
          # They also limit how long one replay step can take: a step sends up to
          # 10 rows and then one marker, one after another, and each send can wait
          # max.block.ms and then delivery.timeout.ms. The event-log module refuses
          # to start procurement unless that fits inside the 5 minutes Kafka allows
          # the replay listener between two polls: (10 + 1) x (10 s + 10 s) = 220 s,
          # plus 35 s for what a failing step also spends = 255 s. Raise them past
          # about 24 s together and procurement will not start.
          # StartupChecksPerProfileTest checks it in every profile.
          producer-properties:
            max.block.ms: 10000         # waiting for the topic's details from the broker
            request.timeout.ms: 5000    # one request to the broker
            delivery.timeout.ms: 10000  # the whole send, retries included
        # Nothing here for the replay-request listener (outboxReplayRequests-in-0)
        # on purpose: the event-log module binds it and sets all of its Kafka
        # settings itself, and its values win over anything written here.
        # ReplayRequestBindingTest pins what the listener gets.

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/oriah

server:
  port: 8093
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ---------------------------------------------------------------------------
# Local fallback for GET /api/v1/admin/procurement/contact-info.
#
# config-repo/procurement.yaml overrides every key below whenever the Config
# Server is up: spring.config.import wins over the document that imports it.
# This block exists so the endpoint -- and, more importantly, the @Validated
# binding -- still work when it is down, which the local/Maven profile
# explicitly tolerates via `optional:configserver`.
#
# Without it, @NotBlank/@NotEmpty on ProcurementContactInfoDto turn an absent
# prefix into BindValidationException and this service refuses to start. That is
# the Tier 4 `base-config` hard-link mistake exactly: centralizing a value
# converted an optional dependency into a required one.
#
# The keys here mirror config-repo/procurement.yaml ONE FOR ONE on purpose. Maps
# merge key by key across property sources while lists are replaced wholesale,
# so an extra key here would survive a config-repo override that omits it and
# leak a stale value into the served response.
# ---------------------------------------------------------------------------
oriah:
  # -------------------------------------------------------------------------
  # The event log (MVP_PLAN Phase 4). Receiving a consignment appends one
  # consignment.received per line to procurement's outbox table in the
  # transaction that receives it; the relay publishes the outbox to Kafka in the
  # order it was written; and a consumer that joins late (inventory, Phase 5) can
  # ask for the whole log again (replay). Procurement consumes no events, so the
  # Inbox stays off -- answered replay requests are recorded in processed_event
  # without it. Each switch is exactly true or false; anything else stops the
  # service. These keys live HERE, not in config-repo: the startup checks read
  # this service's own environment, and a Config Server that is down must not be
  # able to turn the event log off.
  # -------------------------------------------------------------------------
  events:
    producer: procurement             # sent with every message as the `producer` header
    topics: oriah.procurement         # an append to any other topic is refused
    outbox:
      enabled: true
    relay:
      enabled: true
    replay:
      enabled: true
    inbox:
      enabled: false
  procurement:
    contact-info:
      message: "Procurement service contact details are unavailable - the Config Server could not be reached"
      contact-details:
        name: unavailable
        email: unavailable
      on-call-support:
        - unavailable
