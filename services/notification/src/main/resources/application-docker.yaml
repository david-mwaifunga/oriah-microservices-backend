spring:
  datasource:
    # logServerErrorDetail=false: the database never quotes the row it refused, so nothing in a refused row (a mailbox, say)
    # can reach an exception message and, through it, a log line or a dead-letter record.
    url: jdbc:postgresql://postgres-notification:5432/notification?logServerErrorDetail=false
    username: ${SPRING_DATASOURCE_USERNAME:notification}
    password: ${SPRING_DATASOURCE_PASSWORD:notification}
  config:
    import: "configserver:http://configserver:8888"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/oriah
          jwk-set-uri: http://keycloak:8080/realms/oriah/protocol/openid-connect/certs
      client:
        provider:
          keycloak:
            # Inside the stack's network Keycloak is reached by its container name. (The token's issuer stays localhost:7080.)
            token-uri: http://keycloak:8080/realms/oriah/protocol/openid-connect/token

spring.cloud.stream.kafka.binder.brokers: kafka:9092

# Email on the container stack: the mail catcher beside it, by its container name. This stack is not live (no settings file can make
# it so), so notification talks to no other mail server and hands the catcher only addresses on names reserved for testing.
oriah:
  notification:
    email:
      transport: catcher
      catcher:
        host: mailcatcher

eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8761/eureka/
