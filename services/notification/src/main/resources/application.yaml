spring:
  application:
    name: notification
  task:
    scheduling:
      pool:
        # One thread per @Scheduled job, so a slow pass of one never holds back another. Today: the message dispatcher.
        # Add a thread for any further job.
        size: 1
  config:
    import: "optional:configserver:http://localhost:8888"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/oriah
  cloud:
    function:
      definition: orderEvents
    stream:
      bindings:
        orderEvents-in-0:
          destination: oriah.order
          group: notification
          consumer:
            # The body reaches the consumer as the raw bytes Kafka holds. The
            # oriah-events module needs that: when it dead-letters an event it
            # publishes those very bytes again, so its startup check refuses
            # use-native-decoding: true on this binding.
            use-native-decoding: false
            # An event the consumer cannot apply throws (it is never
            # swallowed). oriah.order is read through the Inbox
            # (oriah.events.inbox.topics, below), so it is the oriah-events
            # module -- not the Kafka binder -- that deals with the failure:
            # it delivers the event again, pausing 1 s and then 2 s (each
            # pause double the one before, never more than 10 s).
            # max-attempts counts the deliveries IN ALL, the first one
            # included: 3 here means three deliveries. (The binder's own
            # retry, which this binding used before, counted retries after
            # the first try: four tries for the same number.) Each delivery
            # after the first is a new poll of the same event -- the module
            # moves the partition back to it -- not a loop inside one poll.
            # OrderEventBindingTest works the deliveries out.
            max-attempts: 3
            back-off-initial-interval: 1000
            back-off-multiplier: 2.0
            # Also how long the module waits before it tries again when the
            # dead-letter topic does not take an event (see below).
            back-off-max-interval: 10000
            # ... except a refusal, which fails the same way every time: a
            # type, payload version, aggregate or envelope header the Inbox
            # does not accept, or a body that breaks the contract -- about
            # another order than the envelope names, say (all
            # IllegalArgumentException) -- and a body Jackson cannot read
            # (JsonProcessingException, found inside the
            # UncheckedIOException the consumer wraps it in: the module looks
            # through the causes). Retrying those cannot change the answer and
            # only holds up the orders behind them, so they go to the
            # dead-letter topic on their first delivery.
            # (Plain keys, not "[...]": Spring Cloud Stream's defaults lookup
            # rejects a bracketed key with capitals and the app won't start.)
            retryable-exceptions:
              java.lang.IllegalArgumentException: false
              com.fasterxml.jackson.core.JsonProcessingException: false
      kafka:
        binder:
          brokers: localhost:9092
        bindings:
          orderEvents-in-0:
            consumer:
              # Then the module publishes it to a dead-letter topic of its
              # own, named <topic>.dlq.<group>, and only once that topic has
              # it does it commit the event and move on to the orders behind
              # it. (shared/oriah-events README, "When a message keeps
              # failing".)
              #  * If that publish fails (the topic is missing, the broker
              #    refuses it), the event is NOT committed, so it is not lost:
              #    it is delivered again after a pause and the module tries
              #    the dead-letter topic again, until it lands. Meanwhile every
              #    order event behind it waits, and the log shows one ERROR
              #    from DeadLetterThrottle every 10 to 35 s (the 10 s pause,
              #    plus up to 25 s the failed publish itself can take). That
              #    ERROR and the notification group's lag growing are the
              #    signs to alert on.
              #  * Delivery to the dead-letter topic is at least once: if the
              #    service stops between the publish and the commit, the event
              #    is delivered again and lands there twice.
              #  * Nothing was recorded for a dead-lettered event, so it could
              #    still be sent later -- but today nothing does that: nothing
              #    reads oriah.order.dlq.notification, and notification has no
              #    replay listener (no CatchUp). A database outage that outlasts
              #    the three deliveries parks every order event of that time
              #    there, unsent.
              enable-dlq: true
              dlq-name: oriah.order.dlq.notification
              configuration:
                # Kafka takes the partition away if the next poll is more than
                # max.poll.interval.ms (5 min) away, and the event in hand then
                # comes back to be failed all over again, with every order
                # behind it waiting. One event per poll keeps the worst poll
                # to one event's worst: one try (the database away: up to the
                # pool's 30 s connection timeout), then either the pause
                # before its next delivery (2 s at most here) or the
                # dead-letter publish (up to about 25 s) and, if that fails,
                # the 10 s pause after it -- about 65 s in all. It also
                # commits each event's offset as soon as it is done.
                # OrderEventBindingTest adds it up.
                max.poll.records: 1

# The event log convention (shared/oriah-events). Notification only receives:
# the Inbox records each order event it has sent (processed_event) in the same
# transaction as the notification, so a redelivered event is never sent twice,
# and the message goes out only after that transaction commits
# (OrderEventConsumer). Notification publishes nothing, so outbox, relay and
# replay stay off.
oriah.events.inbox.enabled: true
# The topics notification reads through the Inbox; required while the Inbox
# is on. Their bindings -- here orderEvents-in-0 -- are the ones the module
# takes over for retries and dead-lettering (above); any other binding would
# keep the binder's own, which drops a message when its dead-letter publish
# fails. The service refuses to start if a topic listed here is not read by
# exactly one input binding, so a typo cannot leave oriah.order without it.
oriah.events.inbox.topics: oriah.order

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ---------------------------------------------------------------------------
# Local fallback for GET /api/v1/notifications/contact-info.
#
# config-repo/notification.yaml overrides every key below whenever the Config Server
# is up: spring.config.import wins over the document that imports it. This
# block exists so the endpoint -- and, more importantly, the @Validated
# binding -- still work when it is down, which the local/Maven profile
# explicitly tolerates via `optional:configserver`.
#
# Without it, @NotBlank/@NotEmpty on NotificationContactInfoDto turn an absent prefix
# into BindValidationException and this service refuses to start. That is the
# Tier 4 `base-config` hard-link mistake exactly: centralizing a value
# converted an optional dependency into a required one.
#
# The keys here mirror config-repo/notification.yaml ONE FOR ONE on purpose. Maps
# merge key by key across property sources while lists are replaced wholesale,
# so an extra key here would survive a config-repo override that omits it and
# leak a stale value into the served response.
# ---------------------------------------------------------------------------
oriah:
  notification:
    contact-info:
      message: "Notification service contact details are unavailable - the Config Server could not be reached"
      contact-details:
        name: unavailable
        email: unavailable
      on-call-support:
        - unavailable

    # -----------------------------------------------------------------------
    # Messages (Phase 11). Every timing and limit lives HERE, in the service's
    # own file, so the service starts with the Config Server away.
    #
    # What is NOT here, on purpose: whether this stack is live, the mail
    # account, the live From address, who receives alerts, the support line
    # and the pause switch. Those are read from the process environment only
    # (ProcessEnv, EmailModeGuard). One config repository is served to every
    # stack and wins over this file, so nothing a commit could set may point a
    # test stack at a real mailbox.
    # -----------------------------------------------------------------------
    # The shop's clock: times written in a message.
    zone: Africa/Lusaka
    # The storefront's address, for the link at the foot of a customer's email. Empty = no link.
    site-url: ${ORIAH_NOTIFICATION_SITE_URL:}
    # The shop's own PUBLIC details, written by the owner (config-repo/notification.yaml). Each is left out of a message while it is empty.
    # Never a private person's own number.
    shop:
      pay-line: ""
      collect-line: ""
      contact-line: ""
    email:
      # While NOT live: none (nothing is ever handed to a mail server) or catcher (the local mail catcher). Ignored when live.
      transport: none
      # The local mail catcher. The host must be one of localhost, 127.0.0.1, ::1, mailcatcher: anything else refuses the start.
      catcher:
        host: localhost
        port: 1025
      # The From address while NOT live (it must be on a name reserved for testing), and the name shown beside the address in every mode.
      from-address: no-reply@oriah.local
      from-name: Oriah Jewelry
      smtp:
        # How long to wait for the connection (at most PT30S), for EACH reply, and for one write (each at most send.max-send).
        connect-timeout: PT5S
        read-timeout: PT30S
        write-timeout: PT30S
      # The kinds of message that are emailed as well as shown on the website; every other kind is website only.
      emailed: PAID,READY_TO_COLLECT,ON_ITS_WAY,DELIVERED,PAYMENT_NOT_CONFIRMED
    send:
      # The dispatcher: the one job that sends. On in every profile; the test configuration turns it off and calls it itself.
      enabled: true
      # Milliseconds between two passes, and before the first.
      delay: 5000
      initial-delay: 15000
      # How many waiting messages one pass looks at.
      batch-size: 20
      # The wait after the 1st, 2nd, 3rd and 4th failed try of a message; the last one repeats until the message is too old.
      backoff: PT1M,PT5M,PT15M,PT1H
      # After the mail server itself failed (no connection, no sign-in, a refused sender, a used-up quota) nothing is handed to it
      # for this long; it doubles with each failure in a row, up to the maximum. One failing message must not hammer a failing server.
      server-quiet: PT1M
      server-quiet-max: PT15M
      # How soon a message whose customer's address is not known yet is looked at again (it costs no try).
      address-recheck: PT1M
      # The one wall-clock limit on a whole send, whatever the mail server does (at most PT5M).
      max-send: PT90S
      # How long a message being sent is out of reach of any other sender. It must outlast max-send by PT30S, or the start is refused.
      lease: PT3M
      # How long after its event was recorded a message is still worth emailing. Older than this it is shown on the website only.
      window: PT6H
      # A dispatch step (packed, on its way, delivered) keyed this much later than it happened is not emailed: the customer already has the parcel.
      backdated-step-after: PT24H
    alerts:
      # Used ONLY while not live and only when the matching environment variable is absent: catcher addresses for a developer's own machine.
      sandbox-recipients:
        money: ""
        cost: ""
