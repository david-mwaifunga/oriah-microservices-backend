spring:
  application:
    name: configserver
  # Default to a Git backend (the production-aligned setup).
  # CONFIG_REPO_URI env var overrides this for the docker profile where
  # the repo is mounted into /workspace/config-repo. Tests override via
  # @TestPropertySource to point at a temp clone of the bundled fixture.
  cloud:
    stream:
      kafka:
        binder:
          metrics:
            # The binder builds its own partition-less consumer to compute lag,
            # so every evaluation logs "Not updating high watermark ... no
            # longer assigned". Nothing reads the metric it produces -- the
            # Grafana lag panel plots
            # kafka_consumer_fetch_manager_records_lag_max from the real
            # listener consumers. configserver carries this locally because it
            # cannot fetch its own central config before it is serving.
            default-offset-lag-metrics-enabled: false
    config:
      server:
        git:
          uri: ${CONFIG_REPO_URI:file:///c/Users/mwaif/OneDrive/Documents/github/oriah/config-repo}
          default-label: ${CONFIG_REPO_BRANCH:master}
          # JGit clones into this writable working dir. Lets us mount
          # the source repo read-only at $CONFIG_REPO_URI without
          # JGit trying to write index.lock back to it.
          basedir: ${CONFIG_REPO_BASEDIR:${java.io.tmpdir}/config-repo-checkout}
          # 'force-pull' overwrites any local divergence on the cloned
          # working copy with what's on the remote. Dev-friendly; in
          # prod we'd usually leave it false and gate updates via PRs.
          force-pull: true
          # Fetch from the repository at most once in this many SECONDS, and answer every
          # other request from the local clone. Spring's default, 0, means a fetch on every
          # request, and on 2026-11-11 that took ~10 s each here (the repository is a Windows
          # folder mounted into the container): thirteen services asking at once queued behind
          # one another, the last waited past the clients' 185 s limit, and died with
          # "Read timed out" before they started. A change committed to the repository reaches
          # the services at most this many seconds later (ConfigServerGitBackendTest pins it).
          refresh-rate: ${CONFIG_REPO_REFRESH_RATE:10}
          # Clone when the server STARTS, not at the first request: the first service to ask
          # then gets an answer as fast as the last, and a wrong repository path stops the
          # server at once instead of failing every service later. (A file: URI is read in place
          # and never cloned, so this and the refresh rate do nothing for it: the compose stack
          # therefore gives CONFIG_REPO_URI as a plain path.)
          clone-on-start: ${CONFIG_REPO_CLONE_ON_START:true}
          # Seconds to wait for the repository to answer. Spring's default is 5, and cloning a
          # 0.1 MB repository from the folder mounted into the container (a Windows folder under
          # OneDrive) took longer than that to start sending: "Read timed out after 5,000 ms",
          # and the server exited at start (2026-11-11). It only matters at the clone and the
          # fetch every refresh-rate seconds, never on a request.
          timeout: ${CONFIG_REPO_TIMEOUT:60}
          # Skip SSL verification only for self-signed git hosts (no-op
          # for file:// URLs but doesn't hurt to declare).
          skip-ssl-validation: true

server:
  # Spring Cloud Config's well-known port. Clients default to here.
  port: 8888

management:
  # OTLP METRICS: off, and (where the binder is present) the Kafka offset-lag
  # metric with it.
  #
  # Repeated here rather than inherited from config-repo/application.yaml for a
  # concrete reason: this app cannot read central config at its own startup.
  # configserver would have to fetch from itself before it is serving, and
  # eurekaserver races it. Both therefore boot with Micrometer's defaults and,
  # without this key, were the only processes still logging
  #   WARN Failed to publish metrics to OTLP receiver
  #        (url=http://localhost:4318/v1/metrics) ConnectException
  # every 60s after the rest of the stack went quiet -- which is precisely how
  # they were identified.
  #
  # See the long notes in config-repo/application.yaml for the full reasoning
  # and the jar-verified property names.
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        # /actuator/prometheus is scraped by Prometheus; configserver
        # cannot pull config from itself, so the exposure list is set
        # locally rather than inherited from config-repo/application.yaml.
        # busrefresh is the Spring Cloud Bus broadcast endpoint --
        # POST against it to fan out a refresh to every bus-enabled
        # client over the springCloudBus Kafka topic.
        include: health,info,env,configprops,prometheus,refresh,busrefresh
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    # Config Server registers with Eureka so catalog (and other clients)
    # can discover it via the registry instead of hardcoding
    # localhost:8888. Disabled in tests via @TestPropertySource.
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.oriah.configserver: DEBUG
