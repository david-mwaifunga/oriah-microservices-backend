spring:
  application:
    name: configserver
  profiles:
    # 'native' tells Spring Cloud Config to serve from local files instead of Git.
    # Swap to 'git' once we add a backing repository in a later cycle.
    active: native
  cloud:
    config:
      server:
        native:
          # Classpath-based backend: serves the YAML files we ship in
          # src/main/resources/config/. Future cycle switches this to
          # file:./config-repo/ (a local clone) or a remote Git URL.
          search-locations: classpath:/config/

server:
  # Spring Cloud Config's well-known port. Clients default to here.
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,configprops
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    # Config Server registers with Eureka so catalog (and other clients)
    # can discover it via the registry instead of hardcoding
    # localhost:8888. Disabled in tests via @TestPropertySource.
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.oriah.configserver: DEBUG
