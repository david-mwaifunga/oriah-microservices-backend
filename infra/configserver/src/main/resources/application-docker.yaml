# Overrides applied when SPRING_PROFILES_ACTIVE=docker.

# Spring Cloud Bus over Kafka -- the docker-network broker.
spring:
  kafka:
    bootstrap-servers: kafka:9092
  cloud:
    stream:
      kafka:
        binder:
          brokers: kafka:9092

eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8761/eureka/
