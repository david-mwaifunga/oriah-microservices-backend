spring:
  application:
    name: gatewayserver
  # Reactive Redis client used by RedisRateLimiter on the public
  # routes (see filters below). Overridden in application-docker.yaml
  # to point at the redis service on the docker network.
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      resourceserver:
        jwt:
          # Same Keycloak realm the 12 services validate against. The gateway
          # now rejects unauthenticated traffic at the edge INSTEAD OF
          # forwarding it to twelve applications and letting each reject it --
          # the services keep their own resource servers, because they are
          # directly reachable on the compose network and gateway-only auth
          # would be a downgrade.
          #
          # issuer-uri triggers OIDC discovery EAGERLY at startup
          # (<issuer>/.well-known/openid-configuration), so a @SpringBootTest
          # without Keycloak running fails to create the context. Every test in
          # this module therefore overrides it with a jwk-set-uri, which is
          # lazy -- the same pattern the services use.
          issuer-uri: http://localhost:7080/realms/oriah
  # The route table now lives in Java, as a RouteLocator bean:
  #   config/GatewayRoutesConfig.java
  #
  # Nothing gateway-related is configured here any more, deliberately. A
  # RouteLocator bean does NOT replace a YAML route block -- Gateway's
  # auto-configuration composes a CachingRouteLocator over a
  # CompositeRouteLocator of every RouteLocator bean PLUS the YAML-backed one,
  # so the two UNION. Re-adding routes here while that bean exists silently
  # doubles the table to 58 routes. RouteSnapshotTest pins the id set at 29 and
  # would fail, which is the only reason that trap is survivable.
  #
  # One further trap if anyone pastes a route block back in from the course
  # material: the property prefix moved. GatewayProperties.PREFIX is
  # "spring.cloud.gateway.server.webflux" in Gateway 5.0.x, not
  # "spring.cloud.gateway" as in 4.1.x. The old form binds to NOTHING, raises
  # no error, and the gateway simply starts with an empty route table -- every
  # request 404s.

# Aggregated Swagger UI. Loads at http://localhost:8080/swagger-ui.html
# with a top-right dropdown listing every service spec by name; click
# one and the panel below renders its endpoints.
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - { name: catalog,      url: /v3/api-docs/catalog }
      - { name: inventory,    url: /v3/api-docs/inventory }
      - { name: customer,     url: /v3/api-docs/customer }
      - { name: cart,         url: /v3/api-docs/cart }
      - { name: payment,      url: /v3/api-docs/payment }
      - { name: order,        url: /v3/api-docs/order }
      - { name: promotion,    url: /v3/api-docs/promotion }
      - { name: shipping,     url: /v3/api-docs/shipping }
      - { name: checkout,     url: /v3/api-docs/checkout }
      - { name: notification, url: /v3/api-docs/notification }
      - { name: review,       url: /v3/api-docs/review }
      - { name: search,       url: /v3/api-docs/search }
      - { name: procurement,  url: /v3/api-docs/procurement }
      - { name: finance,      url: /v3/api-docs/finance }
  # api-docs stays enabled (default) -- the swagger-ui's
  # /v3/api-docs/swagger-config endpoint that drives the dropdown is
  # served by springdoc only when api-docs is enabled. The gateway
  # has no controllers of its own so its /v3/api-docs spec is empty;
  # harmless.

server:
  # The conventional edge port. Frontend code talks to localhost:8080.
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  # OTLP METRICS: off. Unlike the twelve services, the gateway does NOT
  # import the Config Server, so the central default in
  # config-repo/application.yaml never reaches it -- the property has to be
  # repeated here or the gateway alone keeps logging
  #   WARN Failed to publish metrics to OTLP receiver
  #        (url=http://localhost:4318/v1/metrics) ConnectException
  # every 60s with a stack trace. Metrics here are scraped by Prometheus like
  # everywhere else; see the long note in config-repo/application.yaml for the
  # full reasoning and the jar-verified property name.
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        # Curated, NOT '*'.
        #
        # This used to be '*', with a comment explaining that the gateway
        # actuator endpoint id "was renamed in Spring Cloud Gateway 5.0.x and
        # the new id is discovered by hitting /actuator". That diagnosis was
        # wrong on both counts, and the expedient outlived it:
        #
        #   * The id was NOT renamed. It is still `gateway`
        #     (GatewayControllerEndpoint). What changed is the GATING:
        #     4.1.x used @RestControllerEndpoint(enableByDefault = false),
        #     5.0.x uses @RestControllerEndpoint(defaultAccess = Access.NONE).
        #   * Exposure and ACCESS are separate gates in Boot 4, so '*' never
        #     made /actuator/gateway/routes reachable anyway. It needs
        #     `management.endpoint.gateway.access: read-only` as well.
        #
        # Meanwhile '*' did do something: it published env, beans, configprops,
        # mappings, threaddump, conditions, loggers and scheduledtasks — on
        # port 8080, which is the PUBLIC EDGE. Values are masked by default so
        # no credentials leaked, but the full bean graph, every route mapping
        # and a thread dump were readable by anyone who could reach the
        # frontend. smoke-test.ps1 step 18 asserts they are gone.
        #
        # `gateway` is deliberately NOT in this list: the route table names
        # every internal service and path prefix, which is topology the edge
        # need not advertise. To inspect it while debugging, start the gateway
        # with:
        #   --management.endpoints.web.exposure.include=health,info,metrics,prometheus,gateway
        #   --management.endpoint.gateway.access=read-only
        # which is exactly what GatewayServerApplicationTests does.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.oriah.gatewayserver: DEBUG
    # Tame the very chatty Eureka and Reactor startup logs.
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
    reactor.netty: WARN
