# Loki single-binary config for local dev.
#
# Storage: in-memory + on-disk under /loki (a docker volume); no S3 /
# object store. Retention defaults to 744h via the limits_config below
# -- plenty for "find that bug from this morning."
#
# Schema v13 + tsdb is the current recommended pairing for Loki 3.x.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

ingester:
  chunk_idle_period: 30m
  chunk_target_size: 1572864
  max_chunk_age: 1h

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 24h
  retention_period: 744h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
