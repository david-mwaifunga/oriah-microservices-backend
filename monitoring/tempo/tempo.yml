# Grafana Tempo — trace storage, replacing Zipkin.
#
# Why the swap: Zipkin was fine for "show me one trace", but Tempo is what the
# rest of this stack is built to talk to. It ingests OTLP natively (our spans
# already travel as OTLP through Micrometer Tracing's OpenTelemetry bridge, and
# were only being translated to Zipkin's v2 wire format on the way out), and it
# shares Grafana's data-source plumbing with Loki and Prometheus so a log line
# can deep-link straight to the trace that produced it.
#
# -----------------------------------------------------------------------------
# VERSION IS PINNED (3.0.0), and the compose service pins it too.
#
# `grafana/tempo:latest` resolved to v3.0.0, a major release that restructured
# the configuration: the top-level `ingester` and `compactor` sections no longer
# exist, and Tempo refused to start with
#
#   failed parsing config: field ingester not found in type app.Config
#                          field compactor not found in type app.Config
#
# Their settings moved into a new live-store / backend-scheduler architecture,
# and the flush tuning has been RESTORED below under `live_store` (both keys
# verified to parse against 3.0.0 by booting the image with this file).
#
# That restoration was not optional, and the story is worth keeping. The first
# pass dropped the tuning with the note "not actually needed: Tempo searches the
# live head block, so a trace produced seconds ago is findable -- and
# smoke-test.ps1 asserts exactly that, so if this assumption is ever wrong the
# smoke test says so." The smoke test then said so: step 12 found nothing for 40
# seconds and the same trace appeared later. Tempo's own metrics explained it --
#
#   tempo_live_store_blocks_cut_total{reason="max_block_duration"}
#
# a trace becomes queryable once its block is CUT and COMPLETED, so visibility
# latency is max_block_duration + complete_block_timeout, which on the defaults
# is the ~40-60s that was observed. Hence 10s + 15s here: a trace written during
# a smoke run is searchable within the run.
#
# Still deliberately omitted:
#   * compactor.block_retention — retention, now under backend-scheduler /
#     backend-worker. The default is generous for a local-dev volume; a smaller
#     window would only save disk.
#
# This is also why the version is pinned rather than floating. `:latest` is what
# produced this surprise, and the same day Grafana's own `:latest` hard-failed
# startup on an unrelated change. A local-dev stack still deserves a
# reproducible one.
# -----------------------------------------------------------------------------

server:
  http_listen_port: 3200
  log_level: warn

# Lets Grafana stream search results as they arrive rather than waiting for the
# whole query. Without it the Explore view feels broken on cold blocks.
stream_over_http_enabled: true

distributor:
  receivers:
    otlp:
      protocols:
        # 4318 (http) is the one the services actually use: the Spring property
        # management.opentelemetry.tracing.export.otlp.transport defaults to
        # 'http', so the wired exporter bean is OtlpHttpSpanExporter
        # (confirmed by SpanExporterCoexistenceTest). Pointing a service at
        # 4317 instead produces no error whatsoever — the spans simply never
        # arrive, which reads as "tracing is broken" with nothing to go on.
        http:
          endpoint: 0.0.0.0:4318
        # grpc is published anyway: it costs nothing and is the first thing
        # you would want if the transport were ever switched.
        grpc:
          endpoint: 0.0.0.0:4317

# Visibility tuning: see the header. A trace is queryable only after its block
# is cut and completed, so these two values together bound how long a
# just-written trace stays invisible. The defaults are production-shaped and far
# too patient for a smoke test that produces a trace and immediately asserts on
# it.
live_store:
  max_block_duration: 10s
  complete_block_timeout: 15s

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
