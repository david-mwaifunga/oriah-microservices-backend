# Auto-provisioned Prometheus datasource for Grafana.
# Grafana reads everything under /etc/grafana/provisioning/datasources
# at startup and creates the corresponding datasources without any
# manual click-through. See https://grafana.com/docs/grafana/latest/administration/provisioning/

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pinned, not generated. grafana/dashboards/oriah-overview.json hardcodes
    # this exact uid in its panel datasource references (it is the uid Grafana
    # assigns the default Prometheus source when a dashboard is exported). With
    # no uid here, Grafana generates a random one, those references resolve to
    # nothing, and the panels only render because isDefault below happens to
    # catch them. Pinning it makes the dashboard correct by construction rather
    # than by fallback, and gives tempo.yaml a stable target for its
    # tracesToMetrics links.
    uid: PBFA97CFB590B2093
    access: proxy
    # Internal DNS on the compose network; the host-mapped port (9090)
    # is incidental -- Grafana talks to Prometheus container-to-container.
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
