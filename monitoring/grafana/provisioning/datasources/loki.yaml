# Auto-provisioned Loki datasource for Grafana.
# Pairs with the Prometheus datasource (prometheus.yaml in this dir).
# Open Grafana -> Explore -> Loki, query `{service="checkout"}` to see
# log streams; add `|= "traceId=..."` to pivot from a Zipkin trace.

apiVersion: 1

datasources:
  - name: Loki
    type: loki
    # Stable uid so Tempo's tracesToLogsV2 can point at it by name. Nothing
    # references Loki by a generated uid today, so pinning this is additive.
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        # Click a traceId in a Loki log line and it opens the corresponding
        # trace. The brief calls this out as the single most valuable debugging
        # affordance for the saga.
        #
        # Previously this pointed at `datasourceUid: zipkin` -- a datasource
        # that was never provisioned (only loki.yaml and prometheus.yaml exist
        # in this directory), so the link had always resolved to nothing. It
        # now targets the Tempo datasource by its pinned uid, which makes it an
        # INTERNAL Grafana link: clicking opens the trace in the split pane
        # rather than navigating out to a separate UI. That is also why there
        # is no `url` here -- a datasourceUid link needs none.
        #
        # The regex matches our JSON log field, not a bracketed console
        # pattern. logback-spring.xml emits one-line JSON with a bare <mdc/>
        # provider, so MDC keys ARE the JSON field names, and
        # MdcTraceCorrelationKeyTest pins those as camelCase traceId/spanId
        # (32 hex / 16 hex). The course's `\[.+,(.+),.+\]` scrapes its
        # `%5p [app,trace_id,span_id]` console layout and would match nothing
        # here -- a dead "View trace" button, failing silently.
        - datasourceUid: tempo
          matcherRegex: '"traceId":"([a-f0-9]{32})"'
          name: traceId
          urlDisplayLabel: 'View trace'
