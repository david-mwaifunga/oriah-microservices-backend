# Oriah API local-dev stack.
#
# One command to bring everything up:   docker compose up -d
# One command to tear everything down:  docker compose down
#
# Service images for the Spring Boot apps are built via Spring Boot
# Buildpacks (`./mvnw spring-boot:build-image` — see build-images.ps1).
# Run that BEFORE `docker compose up` after any code change.
#
# Network topology (compose creates an implicit network where service
# names are DNS hostnames):
#
#   ┌─────────── data tier (no deps) ───────────┐
#   │  postgres-catalog   postgres-inventory     │
#   │  keycloak                                   │
#   └─────────────────────────────────────────────┘
#                  │                │
#                  ▼                ▼
#   ┌─── platform tier ───┐   ┌─ control plane ┐
#   │   configserver       │   │  eurekaserver  │
#   │   (no deps)          │   │  (no deps)     │
#   └──────────────────────┘   └────────────────┘
#                                      │
#                                      ▼
#                              ┌─ gatewayserver ─┐
#                              │  waits: eureka  │
#                              └─────────────────┘
#                  ▼                ▼
#   ┌─ catalog (waits: postgres-catalog, eureka, configserver, keycloak) ─┐
#   │  inventory (waits: postgres-inventory, eureka, configserver, keycloak) │
#   └──────────────────────────────────────────────────────────────────────┘
#
# Port map (host → container):
#   5433 → postgres-catalog:5432       # bumped off 5432 so it doesn't clash
#   5434 → postgres-inventory:5432     # with any local postgres install
#   7080 → keycloak:8080
#   8080 → gatewayserver:8080
#   8081 → catalog:8081                # exposed for direct testing; prod would only expose gateway
#   8082 → inventory:8082
#   8761 → eurekaserver:8761
#   8888 → configserver:8888

services:

  # ─────────────────────────── data tier ───────────────────────────

  postgres-catalog:
    image: postgres:16-alpine
    container_name: oriah-postgres-catalog
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5433:5432"
    volumes:
      - postgres-catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [oriah]

  postgres-inventory:
    image: postgres:16-alpine
    container_name: oriah-postgres-inventory
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5434:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [oriah]

  postgres-customer:
    image: postgres:16-alpine
    container_name: oriah-postgres-customer
    environment:
      POSTGRES_DB: customer
      POSTGRES_USER: customer
      POSTGRES_PASSWORD: customer
    ports:
      - "5435:5432"
    volumes:
      - postgres-customer-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer -d customer"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [oriah]

  postgres-cart:
    image: postgres:16-alpine
    container_name: oriah-postgres-cart
    environment:
      POSTGRES_DB: cart
      POSTGRES_USER: cart
      POSTGRES_PASSWORD: cart
    ports:
      - "5436:5432"
    volumes:
      - postgres-cart-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cart -d cart"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [oriah]

  postgres-payment:
    image: postgres:16-alpine
    container_name: oriah-postgres-payment
    environment:
      POSTGRES_DB: payment
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "5437:5432"
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [oriah]

  postgres-order:
    image: postgres:16-alpine
    container_name: oriah-postgres-order
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    ports:
      - "5438:5432"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [oriah]

  postgres-promotion:
    image: postgres:16-alpine
    container_name: oriah-postgres-promotion
    environment:
      POSTGRES_DB: promotion
      POSTGRES_USER: promotion
      POSTGRES_PASSWORD: promotion
    ports:
      - "5439:5432"
    volumes:
      - postgres-promotion-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promotion -d promotion"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [oriah]

  postgres-notification:
    image: postgres:16-alpine
    container_name: oriah-postgres-notification
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    ports:
      - "5440:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [oriah]

  postgres-review:
    image: postgres:16-alpine
    container_name: oriah-postgres-review
    environment:
      POSTGRES_DB: review
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
    ports:
      - "5441:5432"
    volumes:
      - postgres-review-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [oriah]

  postgres-search:
    image: postgres:16-alpine
    container_name: oriah-postgres-search
    environment:
      POSTGRES_DB: search
      POSTGRES_USER: search
      POSTGRES_PASSWORD: search
    ports:
      - "5442:5432"
    volumes:
      - postgres-search-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search -d search"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [oriah]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: oriah-keycloak
    # start-dev: H2 in-memory DB, no caching, hot-reload — fine for local dev.
    # --import-realm: read every *.json in /opt/keycloak/data/import on first run.
    command: ["start-dev", "--import-realm"]
    environment:
      # Bootstrap admin credentials (Keycloak 26+ uses KC_BOOTSTRAP_* naming).
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # iss-claim hostname. Every token Keycloak issues will carry
      # iss=http://localhost:7080/realms/oriah, regardless of which network
      # the token was requested over. Services trust that iss; JWKS lookup
      # is over the internal network (see application-docker.yaml).
      KC_HOSTNAME: http://localhost:7080
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "7080:8080"
    volumes:
      # Read-only mount of the realm export.
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      # Keycloak 26 UBI ships bash but not curl/wget. We use bash to open
      # a raw TCP socket, send a one-line HTTP request to /realms/master,
      # read the status line, and look for "200". This tells us realm
      # discovery is live (= realm import finished), not just that the
      # port is bound (which happens earlier).
      # Compose variable-interpolates $VAR at parse time. To pass a literal
      # $ to bash (so $line is read as a shell variable, not interpolated to
      # empty by compose), double it: $$line.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/master HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r line <&3 && echo \"$$line\" | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [oriah]

  prometheus:
    # Pulls /actuator/prometheus from every Spring service every 15s
    # and stores time series in-memory + on a small volume. Targets
    # are listed in monitoring/prometheus.yml; add a new service to
    # the stack by appending one line there. UI on http://localhost:9090.
    image: prom/prometheus:latest
    container_name: oriah-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      # Prometheus is built on a stripped Alpine without bash but it
      # ships wget. /-/healthy is the documented liveness endpoint.
      test: ["CMD", "wget", "--quiet", "--spider", "--tries=1", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [oriah]

  grafana:
    # Pre-provisioned with the Prometheus datasource and one starter
    # dashboard (Oriah Backend Overview: HTTP req-rate + p95 latency +
    # JVM heap + Kafka consumer lag, per service). Open
    # http://localhost:3000 -- admin/admin on first login, then it
    # forces a password change.
    image: grafana/grafana:latest
    container_name: oriah-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Suppress the first-login forced password change for the local
      # dev workflow. In prod you definitely want this on.
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider --tries=1 http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks: [oriah]

  loki:
    # Grafana Loki -- log aggregation backend. Single-binary mode with
    # the filesystem object store; storage lives on a docker volume so
    # restarts don't lose history. Port 3100 takes the push API and
    # serves the LogQL query API Grafana proxies to.
    image: grafana/loki:latest
    container_name: oriah-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    # No healthcheck: the grafana/loki image is fully distroless --
    # no shell, no wget, no ls -- so docker has nothing to exec to
    # probe /ready. Promtail uses service_started instead of
    # service_healthy; on first start it retries pushing for a few
    # seconds while Loki's ingester ring warms up, which is fine.
    networks: [oriah]

  promtail:
    # Promtail -- the log shipper. Discovers containers via the Docker
    # socket and streams their stdout into Loki, parsing the JSON
    # payload our services emit so traceId / spanId / level become
    # structured fields and labels (queryable from Grafana Explore).
    image: grafana/promtail:latest
    container_name: oriah-promtail
    command: ["-config.file=/etc/promtail/promtail-config.yaml"]
    volumes:
      - ./monitoring/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      # Docker socket: docker_sd_configs needs API access to list
      # containers + tail their logs. Read-only enough that container
      # cannot use it to control the daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-data:/var/lib/promtail
    depends_on:
      loki:
        condition: service_started
    networks: [oriah]

  zipkin:
    # OpenZipkin with in-memory storage (dev only — stop the container
    # and traces are gone). Port 9411 is both the span-ingest API
    # endpoint (where services POST /api/v2/spans) and the trace browser
    # UI (open http://localhost:9411). Sufficient for the "trace one
    # request across the saga" debugging this is meant to support; a
    # production deploy would back it with Elasticsearch or Cassandra.
    image: openzipkin/zipkin:latest
    container_name: oriah-zipkin
    ports:
      - "9411:9411"
    healthcheck:
      # The openzipkin/zipkin image is Alpine/busybox -- no bash, so
      # the /dev/tcp probe we use for the Spring services doesn't work
      # here. busybox does ship wget, and Zipkin exposes a /health
      # endpoint that goes 200 when the in-memory storage is initialised
      # (i.e., the API is ready to accept spans).
      test: ["CMD", "wget", "--quiet", "--spider", "--tries=1", "http://localhost:9411/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [oriah]

  kafka:
    # Apache Kafka in KRaft mode (no ZooKeeper). 4.x replaced ZK with a
    # self-managed Raft quorum; one container is the broker AND the
    # controller for local-dev. apache/kafka:* is the official image.
    image: apache/kafka:3.9.0
    container_name: oriah-kafka
    environment:
      # Required KRaft single-node config — node-id 1 is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      # Two listeners:
      #   PLAINTEXT — bound to all interfaces on 9092 so external clients
      #               (host curl) and internal clients (catalog/inventory)
      #               can both reach it.
      #   CONTROLLER — internal Raft quorum on 9093, bound to all interfaces.
      # Advertised listeners are what clients are told to connect to; must
      # be a routable hostname (0.0.0.0 is rejected by KafkaConfig validation).
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # Single-node sane defaults — these are all "1" because there's only one broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # KRaft requires a 22-char URL-safe-base64 cluster id (the format
      # `kafka-storage random-uuid` produces). Generated once and pinned
      # so the metadata log on the host volume stays bound to this id
      # across container restarts.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    healthcheck:
      # The apache/kafka image ships bash + nc-style /dev/tcp via bash.
      # Brokers bind 9092 only after the controller comes up, so this
      # check covers full readiness, not just process-started.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9092"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [oriah]

  # ───────────────────────── platform tier ─────────────────────────

  configserver:
    image: oriah/configserver:dev
    container_name: oriah-configserver
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Spring Cloud Config's git backend reads from the path mounted
      # below. Using file:// (not https://) so dev works without GitHub
      # auth; production would point at an https://... remote.
      CONFIG_REPO_URI: file:///workspace/config-repo
      CONFIG_REPO_BRANCH: master
      # Tracing endpoint set directly here because configserver can't
      # bootstrap from itself — the 12 service modules inherit these
      # values via config-repo/application.yaml, but the platform tier
      # has to be told via env.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
    volumes:
      # Read-write mount of the local config-repo. JGit (under Spring
      # Cloud Config) needs write access to maintain its index/HEAD/
      # reflog even when the URI is file:// — basedir indirection
      # doesn't fully solve it for same-host file URIs. Force-pull is
      # on so the configserver resets divergences; the host can still
      # edit and commit normally.
      - ../config-repo:/workspace/config-repo
    ports:
      - "8888:8888"
    healthcheck:
      # bash + coreutils come from paketo run-noble-base (set per build in
      # build-images.ps1). The default run-jammy-tiny has none of these.
      # `/dev/tcp/<host>/<port>` is a bash builtin — opens a TCP socket
      # and exits 0 if the port is accepting connections. No curl needed
      # (noble-base doesn't ship curl either).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8888"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [oriah]

  eurekaserver:
    image: oriah/eurekaserver:dev
    container_name: oriah-eurekaserver
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Tracing direct-set: eureka doesn't pull from configserver.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8761"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [oriah]

  gatewayserver:
    image: oriah/gatewayserver:dev
    container_name: oriah-gatewayserver
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Tracing direct-set: gateway doesn't pull from configserver.
      # The gateway is the trace entrypoint — Micrometer Tracing's
      # WebFlux instrumentation creates the root span and propagates
      # traceparent headers to every backend service via the route.
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
      MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: "http://zipkin:9411/api/v2/spans"
    ports:
      - "8080:8080"
    depends_on:
      eurekaserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [oriah]

  # ───────────────────────── domain tier ───────────────────────────

  catalog:
    image: oriah/catalog:dev
    container_name: oriah-catalog
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Compose-managed secret. Override in a .env file for non-default values.
      SPRING_DATASOURCE_USERNAME: catalog
      SPRING_DATASOURCE_PASSWORD: catalog
    ports:
      - "8081:8081"
    depends_on:
      postgres-catalog:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [oriah]

  inventory:
    image: oriah/inventory:dev
    container_name: oriah-inventory
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventory
    ports:
      - "8082:8082"
    depends_on:
      postgres-inventory:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8082"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [oriah]

  customer:
    image: oriah/customer:dev
    container_name: oriah-customer
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_USERNAME: customer
      SPRING_DATASOURCE_PASSWORD: customer
    ports:
      - "8083:8083"
    depends_on:
      postgres-customer:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8083"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [oriah]

  cart:
    image: oriah/cart:dev
    container_name: oriah-cart
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_USERNAME: cart
      SPRING_DATASOURCE_PASSWORD: cart
    ports:
      - "8084:8084"
    depends_on:
      postgres-cart:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8084"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [oriah]

  payment:
    image: oriah/payment:dev
    container_name: oriah-payment
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_USERNAME: payment
      SPRING_DATASOURCE_PASSWORD: payment
    ports:
      - "8085:8085"
    depends_on:
      postgres-payment:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8085"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [oriah]

  order:
    image: oriah/order:dev
    container_name: oriah-order
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orders
    ports:
      - "8086:8086"
    depends_on:
      postgres-order:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
      configserver:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8086"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks: [oriah]

  promotion:
    image: oriah/promotion:dev
    container_name: oriah-promotion
