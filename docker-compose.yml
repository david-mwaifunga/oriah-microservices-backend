# Oriah API local-dev stack — entry point.
#
# The stack itself lives in docker-compose/default/docker-compose.yml, with
# shared service fragments in docker-compose/common-config.yml. This file
# exists so that every command, script and muscle-memory habit that assumed a
# root docker-compose.yml keeps working unchanged:
#
#   docker compose up -d
#   docker compose down -v
#   docker compose logs -f checkout
#   docker compose build oriah-web
#   powershell.exe -ExecutionPolicy Bypass -File .\smoke-test.ps1
#
# Why the split: the single-file version had grown to 982 lines across 34
# containers, with the docker profile, the network, the healthcheck cadence
# and the configserver/eurekaserver/keycloak dependency triple copy-pasted
# into each of the 12 domain services. That is 12 places to miss when adding
# the 13th service. The `extends` chain in common-config.yml collapses those
# into one definition each, which is also the layout used by the course
# reference this project tracks (microservices/section_12).
#
# The `default/` directory name is deliberate: it leaves room for a `prod/`
# or `qa/` sibling that extends the same common-config.yml with different
# ports, replica counts or image tags, without touching this file.
#
# `include` (not `extends`) is the right mechanism here because we are
# pulling in a whole project — services, volumes and networks together.
# Relative paths inside the included file resolve against ITS directory,
# which is why volume sources there reach back out with ../../ and ../../../.
#
# Equivalence with the pre-split stack is not assumed, it is checked:
#   powershell.exe -ExecutionPolicy Bypass -File .\scripts\compose-equivalence.ps1
# compares `docker compose config` against the recorded baseline and fails on
# any difference in any of the 34 services.

include:
  - docker-compose/default/docker-compose.yml
